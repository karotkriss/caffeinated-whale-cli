[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caffeinated-whale-cli"
version = "0.37.0"
authors = [
  { name = "Christopher McKay", email = "mckay.christopher73@outlook.com" },
]
description = "A CLI tool to help manage Frappe Docker instances."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Build Tools",
    "Intended Audience :: Developers",
    "Environment :: Console",
]

dependencies = [
    "docker>=7.1.0",
    "typer>=0.16.0",
    "rich>=14.0.0",
    "questionary>=2.1.0",
    "toml>=0.10.2",
    "peewee>=3.17.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "types-requests>=2.33.0.20260518",
    "types-toml>=0.10.8.20260518",
]
# Real-Docker E2E tier only. pexpect drives the interactive TTY flows (awaiting
# the prompt_toolkit ESC[?2004h raw-mode marker before each keystroke). NOT
# testcontainers - cwcli owns the `docker compose` lifecycle, so the harness
# drives the real `cwcli` binary, not containers directly. Picked up by
# `uv sync --all-extras`.
e2e = [
    "pexpect>=4.9.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]
skip-string-normalization = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument (required for Typer)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# A bare `pytest` runs only the fast tier: the default `-m` deselects the
# real-Docker E2E markers, so no Docker daemon is needed for local dev / the
# unit CI job. Override on the CLI (`-m e2e`) to run the E2E tier - the last
# `-m` on the command line wins over this default.
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov-report=term-missing",
    # Built-in slowest-N view (setup/call/teardown), on top of the per-test time
    # + description that tests/conftest.py prints inline on each -v line and the
    # E2E init-pole callout in its two-faced Cockpit/Ledger summary. Surfaces in CI logs.
    "--durations=15",
    "-m",
    "not e2e and not e2e_p2p",
]
markers = [
    "unit: fast, mock-free/mock-based tests that need no Docker daemon (the default tier). During the parallel-run migration this also carries the legacy container-mock tests until each command's real E2E lands; see tests/conftest.py.",
    "e2e: real-Docker end-to-end tests that drive the real `cwcli` binary against genuine throwaway instances (requires a Docker daemon).",
    "e2e_p2p: real-Docker P2P (sendme loopback) end-to-end tests; gated, off the per-version matrix.",
]

[tool.coverage.run]
source = ["src/caffeinated_whale_cli"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true


[project.urls]
Homepage = "https://github.com/karotkriss/caffeinated-whale-cli"
Issues = "https://github.com/karotkriss/caffeinated-whale-cli/issues"

[project.scripts]
caffeinated-whale-cli = "caffeinated_whale_cli.main:cli"
cwcli = "caffeinated_whale_cli.main:cli"
