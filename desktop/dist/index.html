<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting cwcli Console</title>
<style>
:root {
  color-scheme: dark;
  --bg: #11110f;
  --panel: #181816;
  --line: #33342f;
  --text: #eee9dd;
  --muted: #b3ad9e;
  --quiet: #827d72;
  --amber: #f6c05f;
  --red: #ff8f78;
  --red-bg: #3d201a;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  padding: 28px;
  background:
    radial-gradient(circle at 50% 24%, rgba(246, 192, 95, 0.09), transparent 34rem),
    var(--bg);
  color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main {
  width: min(100%, 540px);
  padding: 42px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(24, 24, 22, 0.96);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 34px;
}
.mark {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border: 1px solid rgba(246, 192, 95, 0.45);
  border-radius: 12px;
  background: rgba(246, 192, 95, 0.1);
  color: var(--amber);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.04em;
}
.brand-copy strong,
.brand-copy span {
  display: block;
}
.brand-copy strong {
  font-size: 16px;
  line-height: 1.25;
}
.brand-copy span {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}
h1 {
  margin: 0;
  font-size: clamp(24px, 5vw, 32px);
  line-height: 1.15;
  letter-spacing: -0.025em;
}
.lede {
  margin: 12px 0 28px;
  color: var(--muted);
  font-size: 15px;
}
.status {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 46px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.025);
}
.pulse {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
  border-radius: 999px;
  background: var(--amber);
  box-shadow: 0 0 0 0 rgba(246, 192, 95, 0.45);
  animation: pulse 1.8s ease-out infinite;
}
.error {
  display: none;
  margin-top: 18px;
  padding: 16px;
  border: 1px solid rgba(255, 143, 120, 0.42);
  border-radius: 9px;
  background: var(--red-bg);
}
.error[aria-hidden="false"] { display: block; }
.error strong {
  display: block;
  color: var(--red);
  font-size: 15px;
}
.error p {
  margin: 8px 0 0;
  color: var(--text);
}
.error .hint { color: var(--muted); }
.error code {
  display: inline-block;
  margin-top: 12px;
  color: var(--red);
  font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
}
.footnote {
  margin: 22px 0 0;
  color: var(--quiet);
  font-size: 12px;
}
body.failed .pulse {
  background: var(--red);
  box-shadow: none;
  animation: none;
}
@keyframes pulse {
  70% { box-shadow: 0 0 0 9px rgba(246, 192, 95, 0); }
  100% { box-shadow: 0 0 0 0 rgba(246, 192, 95, 0); }
}
@media (max-width: 560px) {
  body { padding: 16px; }
  main { padding: 28px 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; }
}
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="mark" aria-hidden="true">cw</div>
    <div class="brand-copy">
      <strong>cwcli Console</strong>
      <span>Caffeinated Whale</span>
    </div>
  </div>
  <h1 id="title">Preparing your workspace</h1>
  <p class="lede" id="lede">The desktop shell is starting the local cwcli service.</p>
  <div class="status" role="status" aria-live="polite">
    <span class="pulse" aria-hidden="true"></span>
    <span id="status">Starting...</span>
  </div>
  <section class="error" id="error" aria-hidden="true" aria-labelledby="error-title">
    <strong id="error-title">cwcli could not start</strong>
    <p id="error-message"></p>
    <p class="hint" id="error-hint"></p>
    <code id="error-code"></code>
  </section>
  <p class="footnote" id="footnote">This window will open the Console when the local service is ready.</p>
</main>
<script>
const byId = id => document.getElementById(id);

window.__cwcliStatus = message => {
  byId("status").textContent = message;
};

window.__cwcliError = failure => {
  const error = failure || {};
  document.body.classList.add("failed");
  byId("title").textContent = "Could not open cwcli Console";
  byId("lede").textContent = "The desktop shell stopped during startup.";
  byId("status").textContent = "Startup stopped";
  byId("error-message").textContent = error.message || "An unexpected startup error occurred.";
  byId("error-hint").textContent = error.hint || "Try reopening the app.";
  byId("error-code").textContent = error.code ? `Error: ${error.code}` : "";
  byId("error").setAttribute("aria-hidden", "false");
  byId("footnote").textContent = "The app log contains the daemon output and additional details.";
};
</script>
</body>
</html>
