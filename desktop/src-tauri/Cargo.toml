[package]
name = "cwcli-desktop"
version = "0.1.0"
description = "Caffeinated Whale CLI desktop shell (Phase 1)"
authors = ["karotkriss"]
license = "MIT"
repository = "https://github.com/karotkriss/caffeinated-whale-cli"
edition = "2021"
rust-version = "1.77.2"

# Distinct lib name (not the package name) to avoid the Windows bin/lib name
# clash the Tauri template guards against.
[lib]
name = "cwcli_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The shell. Nothing else in the Rust ecosystem is reached: no `bollard` (that
# would fork cwcli's Docker rules into Rust) and no `tauri-plugin-shell` (an
# arbitrary-command surface this design forbids).
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
# A GUI shell wants a small, quiet binary.
panic = "abort"
strip = true
