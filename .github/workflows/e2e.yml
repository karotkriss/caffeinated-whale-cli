name: E2E

# Least-privilege default token: the E2E jobs only check out code and drive
# Docker locally on the runner; read-only repo access is all they need.
permissions:
  contents: read

on:
  # Runs on PRs (see the job `if` for the actual gate) and on demand.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      latency_benches:
        description: >-
          Bench count for the multibench `cwcli status` latency measurement
          (report-status-per-bench task 5.5). Empty skips it. 6 builds a real
          six-bench serving instance on the v16 standalone leg - roughly 1.5 GB
          and a couple of minutes of bench build per bench, which is why it is
          not part of the per-PR matrix.
        required: false
        default: ''

# Cancel superseded runs on the same ref so a rapid push sequence does not queue
# multiple multi-GB E2E matrices.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scope gate: the E2E legs below (frappe v14/v15/v16 + runtime-only) are
  # REQUIRED status checks on develop, so they must ALWAYS report a status - a
  # required context that never runs sits `pending` forever and blocks merge,
  # the exact opposite of the goal. So we do NOT gate the heavy jobs out of
  # existence with a top-level `paths:` filter (that leaves the contexts
  # pending); instead this cheap job decides ONCE whether the diff touches real
  # application logic or dependencies. Each heavy job still enters and
  # short-circuits every Frappe step to an immediate success when the answer is
  # no. A docs-only / CI-config-only / changelog-only / pure-rebase push
  # therefore reports the required E2E contexts green in seconds without a
  # multi-minute real-Docker matrix, while a real src/dep change still runs the
  # full matrix. Governing rule: E2E runs only on a real logic/dep change.
  changes:
    name: Determine E2E scope
    runs-on: ubuntu-latest
    # Same gate as the two heavy jobs below: on a PR that can never trigger the
    # real matrix (wrong base branch, no `e2e` label), skip the checkout/diff
    # work here too - it cannot change either job's outcome.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      github.event.pull_request.base.ref == 'develop' ||
      github.event.pull_request.base.ref == 'master'
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout code
        id: checkout
        # Fail-safe: a checkout failure must not silently skip the required E2E
        # contexts below. Let it fail without failing the job so `decide` can
        # still run and default to run=true.
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          # Full history so the base..head merge-base diff below is computable.
          fetch-depth: 0

      - name: Decide whether the E2E matrix must run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HAS_E2E_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          set -uo pipefail
          # Fail-SAFE, always toward running the matrix: the E2E contexts are
          # REQUIRED, so any uncertainty here (a failed checkout, an undiffable
          # history) must default to run=true. Running the matrix unnecessarily
          # is always safe; skipping on uncertainty is the bug this job exists
          # to remove.
          # A manual dispatch or an explicit `e2e` label is a deliberate request
          # to run the real matrix regardless of what the diff touches.
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$HAS_E2E_LABEL" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "E2E requested explicitly (workflow_dispatch or 'e2e' label) - running the full matrix."
            exit 0
          fi
          if [ "$CHECKOUT_OUTCOME" != "success" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Checkout failed - defaulting to running the full E2E matrix (fail-safe)."
            exit 0
          fi
          # On a PR, run the matrix ONLY when the diff touches application logic
          # (src/**), dependencies (pyproject.toml / uv.lock), or the E2E suite
          # itself (tests/e2e/** - those files ARE the E2E). Everything else
          # (docs, other CI config, CHANGELOG/ledger, unit fixtures, a pure
          # rebase with zero delta) is a provable no-logic/no-dep change and is
          # short-circuited to success. If the diff itself cannot be computed,
          # fall through to run=true rather than aborting the job.
          if ! changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Could not compute the base...head diff - defaulting to running the full E2E matrix (fail-safe)."
            exit 0
          fi
          echo "Files changed in this PR:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(src/|tests/e2e/|pyproject\.toml$|uv\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Logic/dependency change detected - running the full E2E matrix."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No logic/dependency change - short-circuiting the E2E matrix to success."
          fi

  e2e:
    name: E2E (frappe v${{ matrix.frappe }}, ${{ matrix.group }})
    needs: changes
    # Gate: run on a manual dispatch, on a PR carrying the `e2e` label, or on a
    # PR into develop or master. The job ALWAYS enters (so
    # its required context reports) whenever this gate is true; the `changes`
    # scope decision then governs whether the heavy steps below actually do work
    # or short-circuit to green - see the `changes` job header.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      github.event.pull_request.base.ref == 'develop' ||
      github.event.pull_request.base.ref == 'master'
    # Host runner (NO `container:`) so `docker` / `docker compose` and the
    # preinstalled daemon are reachable - the uv container image has no daemon.
    runs-on: ubuntu-latest
    # Provisional ceiling: a full `cwcli init` (image pull + bench init build +
    # new-site) is the dominant cost. Generous, but well under GitHub's 6h cap so
    # a hung `bench init` fails fast. Tune once real runtimes exist.
    # A run that opts into the latency measurement adds a bench build per data
    # point on top of the ordinary leg, which does not fit 45 minutes.
    timeout-minutes: ${{ inputs.latency_benches != '' && 90 || 45 }}
    strategy:
      # One leg per Frappe version, each on its own runner (isolation +
      # parallelism + per-version resource headroom). A leaky instance on one
      # leg cannot poison another; don't cancel the others when one fails.
      #
      # Each version leg is split in two by the `standalone` pytest marker, which
      # is why the workflow's wall clock is roughly half what a single leg costs.
      # `shared` runs the tests that assert against one session-scoped instance
      # and pays one `cwcli init` for it; `standalone` runs the tests that build
      # their own instance or need none at all, and pays no session init. The two
      # groups land on separate runners, so they share no Docker daemon, no disk
      # and no $CWCLI_HOME - which is what makes the split safe without touching a
      # single test body. See the `standalone` marker in pyproject.toml.
      fail-fast: false
      matrix:
        frappe: [14, 15, 16]
        group: [shared, standalone]
    env:
      CWE2E_FRAPPE_MAJOR: ${{ matrix.frappe }}
      # One prefix per job, so every instance name in the whole matrix is unique
      # and a log line names exactly the job that created it. Group isolation
      # does NOT rest on this - it rests on the two groups being separate runners
      # with separate Docker daemons - but a unique name means the two groups
      # would still not collide if they were ever run side by side on one host.
      CWE2E_RUN_ID: gha${{ github.run_id }}-${{ matrix.frappe }}-${{ matrix.group }}
      # True only when a repo admin configured Docker Hub creds; gates the login
      # step so CI still works (anonymous pulls) when they are absent.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # The P2P E2E leg installs the real sendme binary, which queries
      # api.github.com for the latest release; unauthenticated calls share a
      # 60/hour-per-IP limit across the whole runner pool and 403 under load.
      # The automatic job token authenticates that call (5000/hour) without
      # widening `permissions:` above (contents:read is already sufficient).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Opt-in bench count for the task 5.5 latency measurement. Empty on every
      # PR run, so tests/e2e/test_multibench_latency_e2e.py skips itself there.
      CWE2E_LATENCY_BENCHES: ${{ inputs.latency_benches }}

    steps:
      - name: E2E scope
        # Always runs, so the leg's required context is created and the logs
        # state plainly whether the real matrix ran or was short-circuited.
        run: |
          if [ "${{ needs.changes.outputs.run }}" = "true" ]; then
            echo "Logic/dep change - running the real frappe v${{ matrix.frappe }} ${{ matrix.group }} E2E."
          else
            echo "No logic/dep change - skipping the frappe v${{ matrix.frappe }} ${{ matrix.group }} E2E; reporting this required context green."
          fi

      - name: Checkout code
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Reclaim runner disk for the latency measurement
        # ONLY for the opt-in task 5.5 run: six real benches are roughly 9 GB of
        # bind-mounted bench trees on top of the images and the rest of the leg,
        # which does not fit the runner's default free space. Dropping the
        # preinstalled toolchains this job never touches frees well over that.
        # Not run on the ordinary matrix, which has plenty of headroom.
        if: >-
          needs.changes.outputs.run == 'true' &&
          inputs.latency_benches != '' &&
          matrix.group == 'standalone'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install uv
        if: needs.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Log in to Docker Hub
        # Authenticated pulls dodge the anonymous per-IP rate limit on the
        # multi-GB frappe/bench image. Skipped (anonymous pull) when creds absent.
        if: needs.changes.outputs.run == 'true' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preflight - upstream reachability (a DISTINCT signal)
        # cwcli init tracks latest upstream (the frappe_docker@main compose file
        # and the latest frappe/bench tag), so it catches upstream breakage. Pull
        # them here first: an upstream break annotates as an UPSTREAM/INFRA
        # failure, never an ambiguous red assertion, and this warms the base
        # image layers for the real init.
        if: needs.changes.outputs.run == 'true'
        run: |
          set -o pipefail
          if ! curl -fsSL -o /tmp/cwe2e-compose.yml \
              "https://raw.githubusercontent.com/frappe/frappe_docker/refs/heads/main/devcontainer-example/docker-compose.yml"; then
            echo "::error title=Upstream fetch failed::frappe_docker compose file unreachable - upstream/infra issue, NOT a cwcli regression"
            exit 78
          fi
          if ! docker pull frappe/bench:latest; then
            echo "::error title=Upstream pull failed::frappe/bench image pull failed (Docker Hub rate limit or upstream) - NOT a cwcli regression"
            exit 78
          fi

      - name: Install dependencies
        if: needs.changes.outputs.run == 'true'
        run: uv sync --frozen --all-extras

      - name: Run E2E (frappe v${{ matrix.frappe }}, ${{ matrix.group }})
        # Version-sensitive tests run on every leg; version-agnostic tests skip
        # themselves off the non-v16 legs (see tests/e2e). Empty addopts drops
        # the default `-m "not e2e"` and the coverage machinery.
        #
        # The two groups partition the `e2e` tier exactly - every test that ran
        # before still runs, in one group or the other, and `standalone` is the
        # only thing that decides which. tests/e2e/conftest.py fails collection if
        # that marker ever disagrees with the fixtures a test requests.
        #
        # Cross-tier coverage IS obtainable, and "out of process" is no barrier:
        # the harness drives the real `cwcli` console script, which is a Python
        # process, so coverage.py attaches via COVERAGE_PROCESS_START with no
        # harness change (both run_cwcli and spawn_cwcli already pass the env
        # through). It is deliberately NOT wired, on cost: the 3-leg matrix runs
        # on separate runners, so combining needs a cross-runner artifact dance,
        # and a red or flaky E2E leg would then move the coverage number for
        # reasons unrelated to any code change - a worse signal, for ~6-12 points.
        if: needs.changes.outputs.run == 'true'
        run: |
          if [ "${{ matrix.group }}" = "standalone" ]; then
            select="e2e and standalone"
          else
            select="e2e and not standalone"
          fi
          uv run pytest tests/e2e -m "$select" -o addopts="" -v --tb=short

      - name: Teardown backstop - sweep leaked cwe2e- resources
        # Unconditional (given the leg actually ran): even if the run above
        # crashed before `cwcli rm` fired, remove every cwe2e- compose project's
        # containers, volumes, networks, then reclaim the 14 GB SSD. The broad
        # prune is safe here (the runner is ephemeral and discarded) - it
        # deliberately does NOT live in the harness, which also runs on
        # operators' own machines.
        if: always() && needs.changes.outputs.run == 'true'
        run: |
          uv run python - <<'PY'
          from tests.e2e import harness
          print("cwe2e- projects swept by backstop:", harness.sweep_cwe2e())
          PY
          docker system prune -af --volumes || true

  # Packaging-realism leg: run ONE genuine full lifecycle (init -> apps ->
  # inspect -> backup -> rm) against a RUNTIME-DEPS-ONLY `uv tool install .`
  # binary, aimed at via CWCLI_BIN. Every other E2E leg drives the all-extras
  # dev binary, where dev/transitive deps mask an undeclared runtime import - the
  # exact shape of the `click` bug that shipped to 0.37.0. The `clean-install`
  # smoke (test.yml) guards import-time deps but only over `--help`/`config`
  # reads; this exercises real Docker command paths, where a lazily-imported dep
  # would otherwise stay invisible. Single v16 leg (packaging realism is
  # version-agnostic) and OFF the `-m e2e` matrix, so init cost is paid once.
  #
  # Same scope gate as the version matrix: this is a required context too, so it
  # always enters and reports, short-circuiting to green on a no-logic/dep diff.
  e2e-runtime-only:
    name: E2E (runtime-only install)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      github.event.pull_request.base.ref == 'develop' ||
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CWE2E_FRAPPE_MAJOR: 16
      CWE2E_RUN_ID: gha${{ github.run_id }}-rtonly
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: E2E scope
        run: |
          if [ "${{ needs.changes.outputs.run }}" = "true" ]; then
            echo "Logic/dep change - running the runtime-only-install E2E."
          else
            echo "No logic/dep change - skipping the runtime-only-install E2E; reporting this required context green."
          fi

      - name: Checkout code
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # Isolated tool dir/bin so `uv tool install .` resolves purely from
      # [project.dependencies] and never leaks onto PATH (see the clean-install
      # job in test.yml for why these are set here, not at job level).
      - name: Set up isolated tool dirs
        if: needs.changes.outputs.run == 'true'
        run: |
          echo "UV_TOOL_DIR=$RUNNER_TEMP/tooldir" >> "$GITHUB_ENV"
          echo "UV_TOOL_BIN_DIR=$RUNNER_TEMP/toolbin" >> "$GITHUB_ENV"

      - name: Install uv
        if: needs.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Log in to Docker Hub
        if: needs.changes.outputs.run == 'true' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preflight - upstream reachability (a DISTINCT signal)
        if: needs.changes.outputs.run == 'true'
        run: |
          set -o pipefail
          if ! curl -fsSL -o /tmp/cwe2e-compose.yml \
              "https://raw.githubusercontent.com/frappe/frappe_docker/refs/heads/main/devcontainer-example/docker-compose.yml"; then
            echo "::error title=Upstream fetch failed::frappe_docker compose file unreachable - upstream/infra issue, NOT a cwcli regression"
            exit 78
          fi
          if ! docker pull frappe/bench:latest; then
            echo "::error title=Upstream pull failed::frappe/bench image pull failed (Docker Hub rate limit or upstream) - NOT a cwcli regression"
            exit 78
          fi

      # The binary under test: runtime deps ONLY (no dev, no extras), exactly
      # what `uv tool install caffeinated-whale-cli` gives a user.
      - name: Install cwcli as a uv tool (runtime deps only)
        if: needs.changes.outputs.run == 'true'
        run: uv tool install .

      - name: Assert install is runtime-only (dev deps absent)
        if: needs.changes.outputs.run == 'true'
        run: |
          uv pip list --python "$UV_TOOL_DIR/caffeinated-whale-cli" > pkgs.txt
          grep -qi '^click ' pkgs.txt || { echo "FAIL: click not installed (undeclared runtime dep?)"; exit 1; }
          if grep -qi '^pytest ' pkgs.txt; then echo "FAIL: pytest present - install pulled dev deps, not runtime-only"; exit 1; fi

      # The pytest harness itself (pexpect, pytest) runs from the dev venv; the
      # binary it DRIVES is the runtime-only tool, selected via CWCLI_BIN.
      - name: Install test harness dependencies
        if: needs.changes.outputs.run == 'true'
        run: uv sync --frozen --all-extras

      - name: Run runtime-only full-lifecycle E2E
        if: needs.changes.outputs.run == 'true'
        env:
          CWCLI_BIN: ${{ runner.temp }}/toolbin/cwcli
        run: uv run pytest tests/e2e -m e2e_pkg -o addopts="" -v --tb=short

      - name: Teardown backstop - sweep leaked cwe2e- resources
        if: always() && needs.changes.outputs.run == 'true'
        run: |
          uv run python - <<'PY'
          from tests.e2e import harness
          print("cwe2e- projects swept by backstop:", harness.sweep_cwe2e())
          PY
          docker system prune -af --volumes || true
