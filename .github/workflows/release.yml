name: Release

on:
  push:
    tags:
      - "v*.*.*"  # Trigger on version tags like v0.9.1

env:
  # Project variables - configure these in GitHub Settings > Secrets and variables > Actions > Variables
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  PYPI_REPOSITORY: ${{ vars.PYPI_REPOSITORY || 'pypi' }}

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python${{ vars.PYTHON_VERSION || '3.12' }}-bookworm

    # Use environment for PyPI publishing (allows environment protection rules)
    environment:
      name: ${{ vars.PYPI_REPOSITORY || 'pypi' }}
      url: https://pypi.org/project/caffeinated-whale-cli/

    outputs:
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: write  # For creating releases
      id-token: write  # Legacy OIDC permission; current publishing uses UV_PUBLISH_TOKEN

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Configure git safe directory
        # actions/checkout only registers the workspace as a safe directory
        # around its OWN git calls (and again in its post-job cleanup); it
        # does not persist that config for later `run:` steps. This job runs
        # in a container, where the checked-out files are owned by a
        # different UID than the one later `run:` steps execute as, so any
        # step that invokes git directly (here, release-body.sh's `git tag`/
        # `git rev-parse` calls) hits git's "detected dubious ownership"
        # refusal. Registering it globally, once, before any such step is
        # what git's own error message recommends.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Extract version information
        id: version
        run: |
          # Extract version from __init__.py
          INIT_VERSION=$(grep -oP '__version__ = "\K[^"]+' src/caffeinated_whale_cli/__init__.py)
          echo "init_version=$INIT_VERSION" >> $GITHUB_OUTPUT

          # Extract version from pyproject.toml
          TOML_VERSION=$(grep -oP '^version = "\K[^"]+' pyproject.toml)
          echo "toml_version=$TOML_VERSION" >> $GITHUB_OUTPUT

          # Check if triggered by tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          fi

          echo "version=$INIT_VERSION" >> $GITHUB_OUTPUT

      - name: Verify version consistency
        run: |
          echo "Version in __init__.py: ${{ steps.version.outputs.init_version }}"
          echo "Version in pyproject.toml: ${{ steps.version.outputs.toml_version }}"

          if [ "${{ steps.version.outputs.init_version }}" != "${{ steps.version.outputs.toml_version }}" ]; then
            echo "::error::Version mismatch! __init__.py has ${{ steps.version.outputs.init_version }} but pyproject.toml has ${{ steps.version.outputs.toml_version }}"
            exit 1
          fi

          # If triggered by tag, verify tag matches version
          if [ -n "${{ steps.version.outputs.tag_version }}" ]; then
            if [ "${{ steps.version.outputs.tag_version }}" != "${{ steps.version.outputs.init_version }}" ]; then
              echo "::error::Tag version ${{ steps.version.outputs.tag_version }} doesn't match package version ${{ steps.version.outputs.init_version }}"
              exit 1
            fi
          fi

      - name: Compose release body
        id: body
        if: startsWith(github.ref, 'refs/tags/v')
        # Runs BEFORE the build and the PyPI publish: a missing release note
        # must stop the release while stopping it is still free, not after a
        # version has been consumed on PyPI.
        run: |
          .github/scripts/release-body.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ github.repository }}" > "$RUNNER_TEMP/release-body.md"
          echo "path=$RUNNER_TEMP/release-body.md" >> $GITHUB_OUTPUT

          echo "Release body:"
          cat "$RUNNER_TEMP/release-body.md"

      - name: Build package
        run: |
          echo "Building caffeinated-whale-cli v${{ steps.version.outputs.version }}"
          # --no-create-gitignore: uv otherwise drops a .gitignore into dist/,
          # which the release upload glob swept up and GitHub published as an
          # asset named "default.gitignore" (it renames leading-dot uploads).
          # Everything in dist/ is a distributable.
          uv build --no-create-gitignore

          echo "Build artifacts:"
          ls -lah dist/

      - name: Verify package contents
        run: |
          # Install package locally to verify
          uv pip install dist/*.whl --system

          # Verify CLI is accessible
          cwcli --version || echo "Warning: cwcli --version failed"

          echo "Package installed successfully"

      - name: Publish to PyPI
        # uv publish runs natively in the job's uv container (no Docker-action
        # nesting), and authenticates with the UV_PUBLISH_TOKEN secret (a PyPI
        # API token) read from the environment below - so it uses the token and
        # does not attempt trusted publishing.
        # --check-url skips ONLY a byte-identical re-upload (content-hash dedup,
        # for retry/parallel-upload safety within the SAME build); it does NOT
        # skip a same-name but different-content upload - that errors with
        # "Local file and index file do not match" (exit 2). Python builds are
        # non-reproducible, so re-tagging an already-published version rebuilds a
        # byte-different artifact and FAILS rather than skipping. This is NOT
        # twine's skip-existing: each release must be a genuinely new version.
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/

      - name: Create GitHub Release (if tag triggered)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # generate_release_notes is deliberately off: it appends a raw commit
          # list, which is not what the card is for. The body is composed by
          # .github/scripts/release-body.sh - a generated header (version, diff
          # link, release date) around hand-written release copy. See
          # .github/release-notes/README.md.
          name: "caffeinated-whale-cli: v${{ steps.version.outputs.version }}"
          body_path: ${{ steps.body.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ env.PYPI_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Published to:** https://pypi.org/project/caffeinated-whale-cli/${{ steps.version.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install Command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "pip install caffeinated-whale-cli==${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  bump-homebrew-tap:
    name: Update Homebrew Tap
    needs: build-and-publish
    # `needs:` alone already skips this job if build-and-publish failed, so the
    # PyPI publish and GitHub release are never at risk from anything below.
    # `continue-on-error: true` is the second half of the isolation: even a
    # failure INSIDE this job (missing token, tap CI hiccup, PyPI propagation
    # delay, rate limit) reports as a non-fatal "success with issues" job and
    # never turns the overall release workflow run red.
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Resolve PyPI sdist URL and checksum
        id: pypi
        env:
          VERSION: ${{ needs.build-and-publish.outputs.version }}
        run: |
          # PyPI's JSON API is the single source for both the exact sdist URL
          # (its hashed storage path can't be predicted ahead of time) and the
          # sha256 PyPI itself recorded for that file, so one read yields both
          # values the tap formula needs. A short retry loop absorbs the brief
          # propagation gap right after `uv publish` returns - and the sdist
          # lookup lives INSIDE that loop, because the propagation gap can also
          # surface as a version JSON that already exists but does not yet carry
          # its sdist entry; retrying the whole read is what absorbs both.
          URL=""
          SHA256=""
          for i in $(seq 1 10); do
            JSON=$(curl -sf "https://pypi.org/pypi/caffeinated-whale-cli/${VERSION}/json") || JSON=""
            if [ -n "$JSON" ]; then
              URL=$(echo "$JSON" | jq -r '[.urls[] | select(.packagetype=="sdist")][0].url // empty')
              SHA256=$(echo "$JSON" | jq -r '[.urls[] | select(.packagetype=="sdist")][0].digests.sha256 // empty')
              [ -n "$URL" ] && [ -n "$SHA256" ] && break
            fi
            echo "caffeinated-whale-cli ${VERSION} sdist not resolvable on PyPI yet, retrying in 10s ($i/10)..."
            sleep 10
          done
          if [ -z "$URL" ] || [ -z "$SHA256" ]; then
            echo "::error::caffeinated-whale-cli ${VERSION} sdist never resolved on PyPI after retries"
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Bump karotkriss/homebrew-cwcli formula
        # mislav/bump-homebrew-formula-action, pinned by commit SHA (tag v4.2):
        # a Node action that edits the formula file over the GitHub API (no
        # local git/brew needed) and takes an explicit download-url +
        # download-sha256, which fits a custom tap whose formula's `url` is a
        # PyPI sdist rather than a GitHub release tarball. It only rewrites the
        # FIRST top-level `url`/`sha256` pair in the formula, so the per-dependency
        # `resource` blocks in Formula/cwcli.rb are left untouched, as intended.
        uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: cwcli
          homebrew-tap: karotkriss/homebrew-cwcli
          download-url: ${{ steps.pypi.outputs.url }}
          download-sha256: ${{ steps.pypi.outputs.sha256 }}
          # Force PR mode even though HOMEBREW_TAP_TOKEN can push directly: the
          # tap's own test-bot CI (.github/workflows/tests.yml there) must
          # validate the bumped formula before it lands, not after.
          create-pullrequest: true
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  windows-exe:
    name: Build (and optionally sign) the Windows .exe
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/v')
    # GitHub-HOSTED runner, end to end: SignPath's OSS program verifies that
    # every job feeding a signing request ran on GitHub-hosted agents, and uses
    # GitHub-provided run metadata to prove the build was not forged. Keep it so.
    runs-on: windows-latest
    # Additive distribution channel. Like bump-homebrew-tap above, a hiccup here
    # (a Nuitka compile issue, a SignPath timeout) must never turn the release
    # red or endanger the PyPI publish and the GitHub release. `needs:` already
    # skips this job if build-and-publish failed; `continue-on-error` is the
    # second half - a failure INSIDE this job reports as non-fatal.
    continue-on-error: true
    permissions:
      contents: write  # attach the exe asset to the existing GitHub release
      actions: read  # SignPath origin verification reads this run's metadata
    env:
      # Read the SignPath credentials into env ONCE. The signing steps gate on
      # their presence, and a step `if:` may reference `env` but not `secrets`
      # directly. ABSENT credentials => the whole signing path is skipped and the
      # release ships the UNSIGNED exe, so this job is safe to merge before the
      # SignPath Foundation application is approved. See
      # docs/contributing/code-signing.md and docs/contributing/signpath-runbook.md.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build standalone exe (Nuitka --onefile)
        # Nuitka compiles Python -> C -> native code, which reads to AV heuristics
        # like a normal program (far fewer false positives than a PyInstaller
        # self-extractor). Installing the package (`.`) brings in the runtime deps
        # and lets --include-package pull the WHOLE package + its console.html
        # data in, so lazily-imported command modules are not missed by static
        # analysis. The frozen binary has no dist-info; core.version reads the
        # baked-in __version__ literal at runtime.
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka .
          python -m nuitka --onefile --assume-yes-for-downloads `
            --include-package=caffeinated_whale_cli `
            --include-package-data=caffeinated_whale_cli `
            --output-filename=cwcli.exe `
            --output-dir=dist-win `
            packaging/nuitka-entry.py

      - name: Smoke-test the exe
        # A broken build (a missed module, a frozen-context regression) fails here
        # rather than shipping a dead asset.
        run: |
          dist-win\cwcli.exe --version
          dist-win\cwcli.exe --help

      - name: Determine whether SignPath signing is configured
        id: gate
        shell: bash
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath credentials absent - attaching the UNSIGNED exe (see docs/contributing/signpath-runbook.md to enable signing)."
          fi

      - name: Attach UNSIGNED exe to the release (signing disabled)
        if: steps.gate.outputs.signing == 'false'
        # `gh release upload` touches ONLY the asset list - never the hand-written
        # release body composed by build-and-publish.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-and-publish.outputs.version }}
        run: gh release upload "v${VERSION}" dist-win/cwcli.exe --clobber

      - name: Upload unsigned exe as a workflow artifact (for SignPath)
        if: steps.gate.outputs.signing == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: cwcli-windows-unsigned
          path: dist-win/cwcli.exe
          if-no-files-found: error

      - name: Submit to SignPath and download the signed exe
        if: steps.gate.outputs.signing == 'true'
        # Pinned to the v2.2 commit (matches the repo convention of pinning
        # third-party actions by SHA). project-slug/signing-policy-slug must match
        # the names set during SignPath onboarding - see the runbook.
        # wait-for-completion blocks on the per-release manual approval SignPath
        # Foundation requires; that pause is by design, not a hang.
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: caffeinated-whale-cli
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      - name: Attach SIGNED exe to the release
        if: steps.gate.outputs.signing == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-and-publish.outputs.version }}
        run: gh release upload "v${VERSION}" dist-signed/cwcli.exe --clobber
