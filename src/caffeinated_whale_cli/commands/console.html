      addEvent("error", `ACTION ${action} failed`);
    } finally {
      pendingAction = null;
      renderRail();
      el("action-status").textContent = lastAction ? lastAction.text : "";
    }
  }

  // ------------------------------------------------------------------ modals

  const modal = el("modal");
  let modalSubmit = null;
  let modalDismissible = true;

  function openModal(html, onSubmit, {dismissible = true} = {}) {
    el("modal-content").innerHTML = html;
    modalSubmit = onSubmit;
    modalDismissible = dismissible;
    modal.showModal();
    const first = modal.querySelector("input");
    if (first) first.focus();
  }

  el("modal-form").addEventListener("submit", event => {
    const submit = modalSubmit;
    if (!submit) return;
    const values = Object.fromEntries(new FormData(el("modal-form")).entries());
    if (submit(values) === false) {
      event.preventDefault();
      return;
    }
    modalSubmit = null;
  });

  // Cancel is type=button, NOT a submit control: with method="dialog" the form's
  // FIRST submit button is the implicit-submission target, so a submit-type
  // Cancel would make Enter in any field cancel the dialog.
  modal.addEventListener("click", event => {
    if (event.target.closest(".modal-cancel")) {
      modalSubmit = null;
      modal.close();
    }
  });

  modal.addEventListener("cancel", event => {
    if (!modalDismissible) event.preventDefault();
  });

  modal.addEventListener("close", () => {
    modalSubmit = null;
    modalDismissible = true;
  });

  function modalButtons(confirmLabel, disabled) {
    return `<div class="modal-buttons">
      <button type="button" class="modal-cancel">Cancel</button>
      <button value="confirm" class="modal-confirm"${disabled ? " disabled" : ""}>${esc(confirmLabel)}</button>
    </div>`;
  }

  // ---------------------------------------------------------------- doctor (read)

  async function runDoctor() {
    openModal(`<h3 id="modal-title">Environment preflight</h3>
      <div class="doctor-body">${spinner("Running checks…")}</div>
      ${modalButtons("Close")}`, () => true);
    try {
      const response = await fetch("/api/doctor");
      const report = await response.json();
      if (!response.ok) throw new Error((report.error && report.error.message) || "doctor failed");
      renderDoctor(report);
    } catch (error) {
      const body = modal.querySelector(".doctor-body");
      if (body) body.innerHTML = banner("danger", "Doctor failed", error.message || "doctor failed");
    }
  }

  function renderDoctor(report) {
    const body = modal.querySelector(".doctor-body");
    if (!body) return;
    const summary = `<div class="doctor-summary">
      <span class="pass">${report.passed} pass</span>
      <span class="warn">${report.warned} warn</span>
      <span class="fail">${report.failed} fail</span>
      <span>${report.ok ? "ready" : "action needed"}</span>
    </div>`;
    const groups = new Map();
    for (const check of report.checks || []) {
      if (!groups.has(check.group)) groups.set(check.group, []);
      groups.get(check.group).push(check);
    }
    const sections = [...groups.entries()].map(([group, checks]) => {
      const rows = checks.map(check => {
        // A version-freshness check that could not reach PyPI is honestly
        // "pass, unverified" - never smoothed to a clean pass.
        const qualifier = check.version_verified === false ? unknown(" (unverified)") : "";
        const fix = check.fix ? `<div class="doctor-fix">${esc(check.fix)}</div>` : "";
        return `<div class="doctor-check">
          <div class="doctor-head"><span>${esc(check.title)}</span><span class="pill ${esc(check.status)}">${esc(check.status)}${qualifier}</span></div>
          <div class="doctor-detail">${esc(check.detail)}</div>
          ${fix}
        </div>`;
      }).join("");
      return `<div class="doctor-group">${esc(group)}</div>${rows}`;
    }).join("");
    body.innerHTML = summary + sections;
  }

  // ------------------------------------------------------------------ url (read)

  async function runUrlProbe(inst, bench) {
    const selector = benchSelector(bench);
    const origin = {
      project: inst.project,
      benchKey: benchKey(bench),
      benchLabel: bench ? (bench.label || bench.bench_path || selector) : "default bench"
    };
    const query = selector ? `?bench=${encodeURIComponent(selector)}` : "";
    let probeResult = null;
    pendingAction = "probe_url";
    lastAction = null;
    renderRail();
    el("action-status").textContent = `URL check in progress for ${inst.project}`;
    try {
      const response = await fetch(`/api/instance/${encodeURIComponent(inst.project)}/url${query}`);
      const body = await response.json();
      if (response.status === 409 && body.error && body.error.kind === "needs_choice") {
        throw new Error(body.error.message || "select a single bench first");
      }
      if (!response.ok || !body.ok) throw new Error((body.error && body.error.message) || "url probe failed");
      const p = body.outcome;
      const where = p.url ? p.url : "no host URL (port unresolved)";
      const reach = p.url ? (p.reachable ? `reachable (HTTP ${p.http_code})` : "unreachable") : "";
      probeResult = {
        ok: true,
        text: `${p.project} / ${p.bench_path}: ${where}${reach ? ", " + reach : ""}`
      };
    } catch (error) {
      probeResult = {
        ok: false,
        text: `${origin.project} / ${origin.benchLabel}: ${error.message || "url probe failed"}`
      };
    } finally {
      pendingAction = null;
      const selectionStillMatches = selected.project === origin.project
        && (selected.benchKey || "") === origin.benchKey;
      lastAction = selectionStillMatches ? probeResult : null;
      renderRail();
      el("action-status").textContent = lastAction ? lastAction.text : "";
    }
  }

  function openScaleModal(inst) {
    openModal(`<h3 id="modal-title">Scale published ports</h3>
      <p class="modal-help">Widens ${esc(inst.project)}'s published port range so every bench is host-reachable. When the range already covers every bench this is a no-op; when it must expand, cwcli itself asks for confirmation first.</p>
      <label>Cover at least this many benches (blank = just cover what exists)
        <input name="to" type="number" min="1" step="1" autocomplete="off">
      </label>
      ${modalButtons("Check and scale")}`, values => {
      const to = parseInt(values.to, 10);
      runAction("scale_instance", Object.assign({consent: false}, to > 0 ? {to} : {}));
    });
  }

  function openScaleConfirm(project, message, to) {
    openModal(`<h3 id="modal-title">Scale published ports</h3>
      <p class="modal-warning">${esc(message)}</p>
      <label>Type the project name <span class="code">${esc(project)}</span> to confirm
        <input name="confirm" autocomplete="off" required>
      </label>
      ${modalButtons("Scale - restarts benches", true)}`, values => {
      if (values.confirm === project) {
        runAction(
          "scale_instance",
          Object.assign({consent: true}, to > 0 ? {to} : {}),
          project
        );
      }
    });
    const input = modal.querySelector('input[name="confirm"]');
    const confirm = modal.querySelector(".modal-confirm");
    input.addEventListener("input", () => {
      confirm.disabled = input.value !== project;
    });
  }

  function openLabelModal(inst, bench) {
    const target = bench ? (bench.label || bench.bench_path) : "the selected bench";
    openModal(`<h3 id="modal-title">Set bench label</h3>
      <p class="modal-help">A durable handle for ${esc(target)} on ${esc(inst.project)}, usable anywhere a bench selector is.</p>
      <label>Label
        <input name="label" autocomplete="off" required pattern=".*\\S.*" title="Enter at least one non-whitespace character.">
      </label>
      ${modalButtons("Set label")}`, values => {
      const label = (values.label || "").trim();
      if (label) runAction("set_label", {label});
    });
  }

  function openCheckoutModal(inst) {
    const detail = currentDetail();
    const apps = new Set();
    if (detail && detail.state === "ready") {
      (detail.data.benches || []).forEach(bench => (bench.available_apps || []).forEach(app => apps.add(app)));
    }
    const options = [...apps].sort().map(app => `<option value="${esc(app)}"></option>`).join("");
    openModal(`<h3 id="modal-title">Check out an app ref</h3>
      <p class="modal-help">Fetches and checks out a branch, tag, or commit into an app already in the bench on ${esc(inst.project)}. A dirty working tree is refused - commit or stash in-instance work first (the CLI's --reset is the way through, on purpose not offered here).</p>
      <label>App
        <input name="app" autocomplete="off" required pattern=".*\\S.*" title="Enter at least one non-whitespace character." list="modal-apps">
      </label>
      <datalist id="modal-apps">${options}</datalist>
      <label>Ref (branch, tag, or commit)
        <input name="ref" autocomplete="off" required pattern=".*\\S.*" title="Enter at least one non-whitespace character.">
      </label>
      ${modalButtons("Check out")}`, values => {
      const app = (values.app || "").trim();
      const ref = (values.ref || "").trim();
      if (app && ref) runAction("checkout_app", {app, ref});
    });
  }

  function openUnlockModal(inst) {
    const detail = currentDetail();
    const sites = new Set();
    if (detail && detail.state === "ready") {
      (detail.data.benches || []).forEach(bench => (bench.sites || []).forEach(site => sites.add(site.name)));
    }
    const options = [...sites].sort().map(site => `<option value="${esc(site)}"></option>`).join("");
    openModal(`<h3 id="modal-title">Unlock a site</h3>
      <p class="modal-help">Removes the site's locks folder on ${esc(inst.project)}; it regenerates on the next lock. Leave the site blank to use the bench's default site.</p>
      <label>Site (blank = default site)
        <input name="site" autocomplete="off" list="modal-sites">
      </label>
      <datalist id="modal-sites">${options}</datalist>
      ${modalButtons("Unlock")}`, values => {
      const site = (values.site || "").trim();
      runAction("unlock_site", site ? {site} : {});
    });
  }

  // -------------------------------------------------------------- fleet search

  async function runWhere(term) {
    const results = el("where-results");
    results.innerHTML = `<div class="muted">searching the cache…</div>`;
    try {
      const response = await fetch(`/api/where?q=${encodeURIComponent(term)}`);
      const body = await response.json();
      if (!response.ok || !body.ok) {
        throw new Error((body.error && body.error.message) || "could not find out");
      }
      renderWhere(term, body);
    } catch (error) {
      results.innerHTML = banner("danger", null, error.message || "could not find out");
      el("action-status").textContent = "Fleet search failed.";
    }
  }

  function renderWhere(term, body) {
    const rows = body.matches || [];
    // The daemon-unreachable case must not read as "everything is gone": the
    // core reports it as verified=false + per-row "unverified", and both are
    // shown as exactly that.
    const head = body.verified ? "" : banner("warn", null, "Docker was not reachable - matches are remembered, not verified.");
    el("action-status").textContent = `${rows.length} match${rows.length === 1 ? "" : "es"} for ${term}`;
    if (!rows.length) {
      el("where-results").innerHTML = head + `<div class="muted">No cached matches for "${esc(term)}"</div>`;
      return;
    }
    el("where-results").innerHTML = head + rows.map(match => {
      const state = match.project_state === "present"
        ? `<span class="pill up">present</span>`
        : match.project_state === "absent"
          ? `<span class="pill down">instance gone</span>`
          : `<span class="pill unknown">could not verify</span>`;
      const name = match.type === "app"
        ? [match.name, match.version, match.branch].filter(Boolean).join(" ")
        : match.name;
      const meta = [match.type, match.project, match.site, match.type === "app" ? (match.installed ? "installed" : "available only") : null]
        .filter(Boolean).join(" · ");
      return `<div class="where-row">
        <span class="code where-name">${esc(name)}</span>${state}
        <span class="where-meta">${esc(meta)}</span>
      </div>`;
    }).join("");
  }

  el("tree").addEventListener("click", event => {
    const toggle = event.target.closest("[data-toggle]");
    if (toggle) {
      const project = parseKey(toggle.dataset.toggle);
      if (expanded.has(project)) expanded.delete(project);
      else expanded.add(project);
      renderTree();
      return;
    }
    const row = event.target.closest("[data-select]");
    if (!row) return;
    const project = parseKey(row.dataset.project);
    const type = row.dataset.select;
    if (type === "instance") select({type, project});
    if (type === "bench") select({type, project, benchKey: parseKey(row.dataset.bench)});
    if (type === "process") {
      select({
        type,
        project,
        benchKey: parseKey(row.dataset.bench),
        process: parseKey(row.dataset.process)
      });
    }
  });

  function activateTab(tab, focus) {
    activeTab = tab;
    if (selected.project) {
      // Logs are live, so every activation re-reads them; the other tabs serve
      // the cached inspect detail.
      if (tab === "logs") fetchLogs();
      else ensureDetail(selected.project);
    }
    render();
    if (focus) restoreControlFocus(el("tabs"), `tab:${tab}`);
  }

  el("tabs").addEventListener("click", event => {
    const tab = event.target.closest("[data-tab]");
    if (!tab) return;
    activateTab(tab.dataset.tab, false);
  });

  el("tabs").addEventListener("keydown", event => {
    const tab = event.target.closest("[data-tab]");
    if (!tab) return;
    const current = tabs.indexOf(tab.dataset.tab);
    let next = current;
    if (event.key === "ArrowRight") next = (current + 1) % tabs.length;
    else if (event.key === "ArrowLeft") next = (current - 1 + tabs.length) % tabs.length;
    else if (event.key === "Home") next = 0;
    else if (event.key === "End") next = tabs.length - 1;
    else return;
    event.preventDefault();
    activateTab(tabs[next], true);
  });

  el("rail-body").addEventListener("click", event => {
    const read = event.target.closest("[data-read]");
    if (read && read.getAttribute("aria-disabled") !== "true") {
      const inst = selectedInstance();
      if (inst && !pendingAction && read.dataset.read === "url") runUrlProbe(inst, selectedBench());
      return;
    }
    const button = event.target.closest("[data-action]");
    if (!button || button.getAttribute("aria-disabled") === "true") return;
    const action = button.dataset.action;
    const inst = selectedInstance();
    if (!inst || pendingAction) return;
    if (action === "set_label") return openLabelModal(inst, selectedBench());
    if (action === "checkout_app") return openCheckoutModal(inst);
    if (action === "unlock_site") return openUnlockModal(inst);
    if (action === "scale_instance") {
      // Ask WITHOUT consent first: when expansion is needed, core answers
      // NEEDS_CHOICE/confirm_scale and its message drives the typed-name
      // confirm; a covering no-op never asks. Consent means consent only.
      return openScaleModal(inst);
    }
    runAction(action);
  });

  el("detail").addEventListener("click", event => {
    if (event.target.closest("[data-logs-refresh]")) fetchLogs();
  });

  el("doctor-button").addEventListener("click", () => runDoctor());

  el("where-form").addEventListener("submit", event => {
    event.preventDefault();
    const term = el("where-input").value.trim();
    if (term) runWhere(term);
  });

  // --------------------------------------------------------------- auth gate

  // Authentication is OFF on the ordinary loopback run, so this probe answers
  // 200 and the page connects with nothing shown. It only asks when the daemon
  // was started with CWCLI_SERVE_TOKEN, which is the deliberate remote-bind
  // case. One POST exchanges the token for the daemon's HttpOnly session
  // cookie; after that every fetch AND the EventSource carry it automatically,
  // which is why EventSource - which cannot send an Authorization header -
  // needs no special handling here.
  async function startSession() {
    let probe;
    try {
      probe = await fetch("/api/snapshot");
    } catch (error) {
      connectEvents();  // daemon unreachable: let the stream's own retry loop say so
      return;
    }
    if (probe.status !== 401) {
      connectEvents();
      return;
    }
    askForToken("This cwcli serve daemon requires its access token.");
  }

  function askForToken(message) {
    setConnection("locked");
    openModal(`<h3 id="modal-title">Access token required</h3>
      <p class="modal-help">${esc(message)} It is the value of <code>CWCLI_SERVE_TOKEN</code> in the shell that started <code>cwcli serve</code>. The token is sent once, in exchange for a session cookie for this daemon launch.</p>
      <label>Access token
        <input name="token" type="password" autocomplete="off" required>
      </label>
      <div class="modal-buttons"><button value="confirm" class="modal-confirm">Unlock</button></div>`,
    values => {
      const token = (values.token || "").trim();
      if (!token) {
        const input = modal.querySelector('input[name="token"]');
        input.setCustomValidity("Enter an access token containing a non-whitespace character.");
        input.reportValidity();
        input.addEventListener("input", () => input.setCustomValidity(""), {once: true});
        return false;
      }
      openTokenSession(token);
    }, {dismissible: false});
  }

  async function openTokenSession(token) {
      let response;
      try {
        response = await fetch("/api/session", {
          method: "POST",
          headers: {"Authorization": "Bearer " + token, "Content-Type": "application/json"},
          body: "{}"
        });
      } catch (error) {
        return askForToken("Could not reach the daemon. Try again.");
      }
      if (!response.ok) return askForToken("That token was not accepted.");
      connectEvents();
  }

  // First paint before any server data: honest empty states in every pane
  // rather than a blank shell while the first snapshot (or a dead daemon's
  // retry loop) is pending.
  render();
  startSession();
})();
</script>
</body>
</html>
