<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cwcli Console</title>
<style>
/* ---------------------------------------------------------------------------
   Design tokens, adapted from the canonical design system so this
   single-file Console stays self-contained. SOURCE OF TRUTH: design/tokens/*.css
   (base, colors, elevation, fonts, motion, radius, spacing, typography). Do not
   hand-tune values here - edit design/tokens and re-inline. Console rules below
   use these tokens except for structural layout dimensions, breakpoints,
   hairlines, the design-specified focus ring, and fixed chrome sizes.
   --------------------------------------------------------------------------- */

/* design/tokens/fonts.css */
/* IBM Plex Sans and JetBrains Mono render only where system-installed until
   self-hosted @font-face rules land. */
:root {
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --font-display: var(--font-sans);
}

/* design/tokens/colors.css */
:root {
  color-scheme: dark;

  --cw-abyss: #060a18;
  --cw-ink-900: #0a0f22;
  --cw-ink-800: #101030;
  --cw-ink-700: #161c3c;
  --cw-ink-600: #1e2749;

  --cw-deep-600: #0d3560;
  --cw-deep-500: #104070;
  --cw-deep-400: #105080;

  --cw-whale-700: #0078a8;
  --cw-whale-600: #0090c0;
  --cw-whale-500: #00a0d0;
  --cw-whale-400: #00b0d0;
  --cw-whale-300: #4fc8e4;

  --cw-foam-400: #c0e0f0;
  --cw-foam-300: #d0f0ff;
  --cw-foam-200: #e0f0ff;
  --cw-foam-100: #f0ffff;

  --cw-clay-400: #d08080;
  --cw-clay-500: #c06060;
  --cw-clay-600: #b06060;
  --cw-clay-800: #703040;

  --cw-n-950: #070b18;
  --cw-n-900: #0b1124;
  --cw-n-850: #0f1730;
  --cw-n-800: #141d3a;
  --cw-n-700: #1c2748;
  --cw-n-600: #27345a;
  --cw-n-500: #3c4b73;
  --cw-n-400: #5a6b93;
  --cw-n-300: #8496b8;
  --cw-n-200: #b4c3da;
  --cw-n-100: #dce6f2;
  --cw-n-50: #f2f7fc;

  /* Health tokens: exactly the five core.status / core.fleet states. */
  --cw-status-running: #2fbf8f;
  --cw-status-online: #00a0d0;
  --cw-status-degraded: #e8b23a;
  --cw-status-offline: #e4574c;
  --cw-status-unknown: #7c8aa5;

  /* Terminal palette: what Rich prints, mapped to pixels. */
  --cw-term-cyan: #00a0d0;
  --cw-term-magenta: #b98be3;
  --cw-term-green: #2fbf8f;
  --cw-term-yellow: #e8b23a;
  --cw-term-red: #e4574c;
  --cw-term-dim: #5a6b93;
  --cw-term-fg: #dce6f2;
  --cw-term-bg: #070b18;

  --bg-app: var(--cw-n-950);
  --bg-sunken: #050813;
  --bg-surface: var(--cw-n-900);
  --bg-surface-raised: var(--cw-n-850);
  --bg-overlay: #0d1428;
  --bg-hover: rgba(132, 150, 184, 0.09);
  --bg-active: rgba(132, 150, 184, 0.15);
  --bg-selected: rgba(0, 160, 208, 0.14);
  --bg-scrim: rgba(6, 10, 24, 0.72);

  --text-primary: var(--cw-n-100);
  --text-secondary: var(--cw-n-300);
  --text-muted: var(--cw-n-400);
  --text-disabled: var(--cw-n-500);
  --text-accent: var(--cw-whale-300);
  --text-danger: var(--cw-status-offline);
  --text-inverse: var(--cw-ink-900);

  --border-subtle: rgba(132, 150, 184, 0.12);
  --border-default: rgba(132, 150, 184, 0.2);
  --border-strong: rgba(132, 150, 184, 0.34);
  --border-accent: rgba(0, 160, 208, 0.55);

  --accent: var(--cw-whale-500);
  --accent-hover: var(--cw-whale-400);
  --accent-active: var(--cw-whale-600);
  --accent-fg: #04121c;
  --accent-soft: rgba(0, 160, 208, 0.14);
  --danger: var(--cw-status-offline);
  --danger-hover: #ef6b60;
  --danger-fg: #1a0705;
  --danger-soft: rgba(228, 87, 76, 0.14);
  --focus-ring: rgba(0, 176, 208, 0.6);

  --link: var(--cw-whale-300);
  --link-hover: var(--cw-foam-300);
}

[data-theme="light"] {
  color-scheme: light;
  --bg-app: #eef4fa;
  --bg-sunken: #e2ebf5;
  --bg-surface: #ffffff;
  --bg-surface-raised: #ffffff;
  --bg-overlay: #ffffff;
  --bg-hover: rgba(16, 64, 112, 0.06);
  --bg-active: rgba(16, 64, 112, 0.11);
  --bg-selected: rgba(0, 160, 208, 0.12);
  --bg-scrim: rgba(10, 15, 34, 0.4);

  --text-primary: var(--cw-ink-800);
  --text-secondary: #46557a;
  --text-muted: #647399;
  --text-disabled: #93a1bf;
  --text-accent: var(--cw-whale-700);
  --text-inverse: #ffffff;

  --border-subtle: rgba(16, 64, 112, 0.12);
  --border-default: rgba(16, 64, 112, 0.2);
  --border-strong: rgba(16, 64, 112, 0.32);

  --accent-fg: #ffffff;
  --accent: var(--cw-whale-600);
  --accent-hover: var(--cw-whale-500);
  --accent-active: var(--cw-whale-700);
  --danger-fg: #ffffff;

  --cw-term-fg: #101030;
  --cw-term-bg: #f2f7fc;
  --cw-term-dim: #647399;

  --link: var(--cw-whale-700);
  --link-hover: var(--cw-deep-500);
}

/* design/tokens/typography.css */
:root {
  --text-2xs: 10px;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-md: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 26px;
  --text-3xl: 34px;
  --text-4xl: 44px;

  --leading-tight: 1.15;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;
  --tracking-caps: 0.09em;

  --type-display: var(--weight-semibold) var(--text-3xl) / var(--leading-tight) var(--font-display);
  --type-title: var(--weight-semibold) var(--text-xl) / var(--leading-snug) var(--font-sans);
  --type-heading: var(--weight-semibold) var(--text-lg) / var(--leading-snug) var(--font-sans);
  --type-body: var(--weight-regular) var(--text-md) / var(--leading-normal) var(--font-sans);
  --type-body-strong: var(--weight-medium) var(--text-md) / var(--leading-normal) var(--font-sans);
  --type-meta: var(--weight-regular) var(--text-sm) / var(--leading-snug) var(--font-sans);
  --type-mono: var(--weight-regular) var(--text-sm) / var(--leading-normal) var(--font-mono);
  --type-mono-strong: var(--weight-medium) var(--text-sm) / var(--leading-normal) var(--font-mono);
  --type-label: var(--weight-semibold) var(--text-2xs) / 1.2 var(--font-sans);
}

/* design/tokens/spacing.css */
:root {
  --space-0: 0px;
  --space-1: 2px;
  --space-2: 4px;
  --space-3: 6px;
  --space-4: 8px;
  --space-5: 10px;
  --space-6: 12px;
  --space-7: 16px;
  --space-8: 20px;
  --space-9: 24px;
  --space-10: 32px;
  --space-11: 40px;
  --space-12: 56px;
  --space-13: 72px;

  --rail-width: 56px;
  --tree-width: 264px;
  --action-rail-width: 216px;
  --titlebar-height: 38px;
  --toolbar-height: 44px;
  --statusbar-height: 26px;
  --row-height: 28px;
  --row-height-lg: 34px;
  --control-height-sm: 24px;
  --control-height: 30px;
  --control-height-lg: 36px;
}

/* design/tokens/radius.css */
:root {
  --radius-xs: 3px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-pill: 999px;
  --radius-window: 10px;
}

/* design/tokens/elevation.css */
:root {
  --shadow-none: none;
  --shadow-inset-top: inset 0 1px 0 rgba(220, 230, 242, 0.05);
  --shadow-sm: 0 1px 2px rgba(4, 8, 20, 0.5);
  --shadow-md: 0 4px 12px rgba(4, 8, 20, 0.45);
  --shadow-lg: 0 12px 32px rgba(4, 8, 20, 0.55);
  --shadow-window: 0 24px 64px rgba(4, 8, 20, 0.65);
  --ring-focus: 0 0 0 2px var(--focus-ring);
  --ring-selected: inset 2px 0 0 var(--accent);
  --blur-overlay: blur(14px) saturate(140%);
}

/* design/tokens/motion.css */
:root {
  --ease-out: cubic-bezier(0.2, 0.6, 0.3, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --duration-instant: 80ms;
  --duration-fast: 120ms;
  --duration-base: 160ms;
  --duration-slow: 240ms;
  --transition-control: background-color var(--duration-fast) var(--ease-out),
    border-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
@keyframes cw-spin { to { transform: rotate(360deg); } }
@keyframes cw-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes cw-delta-in { from { background-color: var(--accent-soft); } to { background-color: transparent; } }

/* design/tokens/base.css (adapted: Console body styles are declared below) */
:root { --cw-selection: rgba(0, 160, 208, 0.32); }
::selection { background: var(--cw-selection); }
a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; }
*:focus-visible { outline: none; box-shadow: var(--ring-focus); border-radius: var(--radius-sm); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-default); border: 3px solid transparent; background-clip: content-box; border-radius: var(--radius-pill); }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); background-clip: content-box; }

/* ---------------------------------------------------------------------------
   Console-local aliases onto the tokens above. Each is an alias to a design
   token, never a new colour: the five health tokens resolve to their exact
   defined colours (design/tokens/colors.css).
   --------------------------------------------------------------------------- */
:root {
  --bg: var(--bg-app);
  --panel: var(--bg-surface);
  --panel-2: var(--bg-surface-raised);
  --line: var(--border-default);
  --line-soft: var(--border-subtle);
  --text: var(--text-primary);
  --muted: var(--text-secondary);
  --quiet: var(--text-muted);
  --green: var(--cw-status-running);
  --amber: var(--cw-status-degraded);
  --red: var(--cw-status-offline);
  --blue: var(--cw-status-online);
  --slate: var(--cw-status-unknown);
  --focus: var(--focus-ring);
  --shadow: var(--shadow-lg);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: var(--weight-regular) var(--text-base)/var(--leading-normal) var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { color: inherit; }
.app {
  /* Above 760px, use a fixed-viewport shell so the tree, detail pane, and
     event log scroll inside their own panels while the action rail and
     connection state stay visible. Narrow screens restore page scrolling. */
  height: 100vh;
  display: grid;
  grid-template-columns: minmax(260px, 320px) minmax(0, 1fr) minmax(260px, 300px);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas:
    "banner banner banner"
    "sidebar main rail";
  background: var(--bg-app);
}
.conn-banner {
  grid-area: banner;
  padding: var(--space-5) var(--space-9);
  background: color-mix(in srgb, var(--cw-status-degraded) 16%, transparent);
  color: var(--amber);
  border-bottom: 1px solid color-mix(in srgb, var(--cw-status-degraded) 40%, transparent);
  font-weight: var(--weight-semibold);
  overflow-wrap: anywhere;
}
.app.stale .pill { filter: grayscale(0.55); }
.sidebar, .rail {
  min-width: 0;
  background: var(--bg-surface);
  border-color: var(--line);
  border-style: solid;
}
.sidebar {
  grid-area: sidebar;
  border-width: 0 1px 0 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.main { grid-area: main; }
.rail {
  grid-area: rail;
  border-width: 0 0 0 1px;
  display: grid;
  /* head / scrolling action groups / the static fleet-search panel. The search
     panel is OUTSIDE #rail-body because the rail re-renders on every delta and
     an input inside it would lose its text and focus mid-typing. */
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.brand, .rail-head {
  padding: var(--space-8) var(--space-8) var(--space-7);
  border-bottom: 1px solid var(--line-soft);
}
.brand h1, .rail-head h2 {
  margin: 0;
  font-size: var(--text-lg);
  line-height: var(--leading-tight);
  font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-normal);
}
.connection {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin-top: var(--space-5);
  color: var(--muted);
  font-size: var(--text-sm);
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--quiet);
  flex: 0 0 auto;
}
.dot.open { background: var(--green); }
.dot.reconnecting { background: var(--amber); }
.doctor-button {
  margin-top: var(--space-4);
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  cursor: pointer;
}
.doctor-button:hover { background: var(--bg-hover); }
.doctor-summary {
  display: flex;
  gap: var(--space-7);
  margin-bottom: var(--space-5);
  font-size: var(--text-md);
}
.doctor-summary .pass { color: var(--green); }
.doctor-summary .warn { color: var(--amber); }
.doctor-summary .fail { color: var(--red); }
.doctor-group { margin: var(--space-6) 0 var(--space-2); font-size: var(--text-sm); color: var(--muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); }
.doctor-check { padding: var(--space-4) 0; border-top: 1px solid var(--line); }
.doctor-check .doctor-head { display: flex; align-items: center; gap: var(--space-4); justify-content: space-between; }
.doctor-check .doctor-detail { margin-top: var(--space-2); font-size: var(--text-md); color: var(--muted); }
.doctor-check .doctor-fix { margin-top: var(--space-2); font-size: var(--text-sm); color: var(--blue); }
.tree {
  min-width: 0;
  overflow: auto;
  padding: var(--space-5);
}
.tree-empty, .empty {
  color: var(--muted);
  padding: var(--space-8);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  background: var(--bg-surface);
}
.instance-group { margin-bottom: var(--space-3); }
.tree-line {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  align-items: stretch;
  gap: var(--space-1);
}
.tree-row, .twisty, .tab, .action-button {
  border: 0;
  background: transparent;
}
.twisty {
  width: 24px;
  min-height: 34px;
  color: var(--quiet);
  border-radius: var(--radius-md);
  cursor: pointer;
}
.twisty:hover { background: var(--bg-hover); color: var(--text); }
.tree-row {
  width: 100%;
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-md);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.tree-row:hover { background: var(--bg-hover); }
.tree-row.selected {
  background: var(--bg-selected);
  box-shadow: var(--ring-selected);
}
.tree-row.selected:focus-visible { box-shadow: var(--ring-selected), var(--ring-focus); }
.tree-label {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: var(--weight-semibold);
}
.tree-meta {
  display: block;
  min-width: 0;
  color: var(--muted);
  font-size: var(--text-sm);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tree-row > span:first-child {
  min-width: 0;
}
.children {
  margin-left: 28px;
  padding-left: var(--space-5);
  border-left: 1px solid var(--line-soft);
}
.tree-row.bench, .tree-row.process {
  grid-template-columns: minmax(0, 1fr) auto;
  padding-top: var(--space-4);
  padding-bottom: var(--space-4);
}
.tree-row.process .tree-label {
  font-weight: var(--weight-medium);
  font-family: var(--font-mono);
  font-size: var(--text-sm);
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  max-width: 100%;
  min-height: 22px;
  padding: 0 var(--space-4) 0 var(--space-3);
  border-radius: var(--radius-pill);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.pill::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: var(--radius-pill);
  background: currentColor;
  flex: 0 0 auto;
}
.pill.unknown::before { animation: cw-pulse 1.6s var(--ease-in-out) infinite; }
.pill.running, .pill.up { color: var(--cw-status-running); background: color-mix(in srgb, var(--cw-status-running) 16%, transparent); }
.pill.degraded { color: var(--cw-status-degraded); background: color-mix(in srgb, var(--cw-status-degraded) 16%, transparent); }
.pill.down { color: var(--cw-status-offline); background: color-mix(in srgb, var(--cw-status-offline) 16%, transparent); }
.pill.offline { color: var(--cw-status-offline); background: color-mix(in srgb, var(--cw-status-offline) 16%, transparent); }
.pill.online { color: var(--cw-status-online); background: color-mix(in srgb, var(--cw-status-online) 16%, transparent); }
.pill.unknown { color: var(--cw-status-unknown); background: color-mix(in srgb, var(--cw-status-unknown) 16%, transparent); }
.pill.neutral { color: var(--muted); background: var(--bg-active); }
.pill.pass { color: var(--cw-status-running); background: color-mix(in srgb, var(--cw-status-running) 16%, transparent); }
.pill.warn { color: var(--cw-status-degraded); background: color-mix(in srgb, var(--cw-status-degraded) 16%, transparent); }
.pill.fail { color: var(--cw-status-offline); background: color-mix(in srgb, var(--cw-status-offline) 16%, transparent); }
.main {
  min-width: 0;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
}
.topbar {
  min-width: 0;
  padding: var(--space-8) var(--space-9) var(--space-7);
  border-bottom: 1px solid var(--line-soft);
  background: var(--bg-surface);
}
.crumb {
  color: var(--muted);
  font-size: var(--text-sm);
  margin-bottom: var(--space-4);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.title-row {
  display: flex;
  gap: var(--space-6);
  align-items: center;
  min-width: 0;
}
.title-row h2 {
  margin: 0;
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: var(--text-2xl);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-normal);
}
.subtitle {
  margin-top: var(--space-4);
  color: var(--muted);
  max-width: 78ch;
}
.tabs {
  display: flex;
  gap: var(--space-1);
  padding: var(--space-5) var(--space-9) 0;
  border-bottom: 1px solid var(--line-soft);
  overflow-x: auto;
}
.tab {
  padding: var(--space-5) var(--space-6);
  color: var(--muted);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  cursor: pointer;
  white-space: nowrap;
}
.tab.active {
  color: var(--text);
  background: var(--panel);
  box-shadow: inset 0 -2px 0 var(--accent);
}
.tab.active:focus-visible { box-shadow: inset 0 -2px 0 var(--accent), var(--ring-focus); }
.tab small {
  color: var(--quiet);
  margin-left: var(--space-2);
  font-size: var(--text-xs);
}
.detail {
  min-width: 0;
  overflow: auto;
  padding: var(--space-9) var(--space-9) var(--space-10);
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-6);
  margin-bottom: var(--space-8);
}
.metric {
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-6);
}
.metric .label {
  color: var(--muted);
  font: var(--type-label);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  margin-bottom: var(--space-3);
}
.metric .value {
  min-width: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-mono);
  font-size: var(--text-md);
  font-weight: var(--weight-medium);
  color: var(--text-primary);
}
.section {
  margin-top: var(--space-9);
}
.section h3 {
  margin: 0 0 var(--space-5);
  font-size: var(--text-base);
  letter-spacing: var(--tracking-normal);
}
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  background: var(--panel);
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 620px;
}
th, td {
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--line-soft);
  text-align: left;
  vertical-align: top;
}
th {
  color: var(--muted);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
}
tr:last-child td { border-bottom: 0; }
td.code, .code {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
}
.muted { color: var(--muted); }
.unknown-text { color: var(--slate); }
.site-apps {
  display: grid;
  gap: var(--space-6);
}
.inventory-block {
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  background: var(--panel);
  padding: var(--space-7);
  min-width: 0;
}
.inventory-title {
  display: flex;
  gap: var(--space-4);
  align-items: center;
  min-width: 0;
  margin-bottom: var(--space-5);
  font-weight: var(--weight-bold);
}
.inventory-title span:first-child {
  min-width: 0;
  overflow-wrap: anywhere;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}
/* Tag - a monospace chip for a machine value (app, port, branch, site). */
.chip {
  max-width: 100%;
  min-width: 0;
  display: inline-flex;
  align-items: center;
  min-height: 20px;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: 0 var(--space-3);
  color: var(--text-secondary);
  background: var(--bg-hover);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  overflow-wrap: anywhere;
}
.rail-body {
  min-width: 0;
  overflow: auto;
  padding: var(--space-7);
}
.target {
  min-width: 0;
  padding: var(--space-6);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  background: var(--panel);
  box-shadow: var(--shadow);
}
.target-name {
  min-width: 0;
  overflow-wrap: anywhere;
  font-weight: var(--weight-bold);
}
.target-meta {
  margin-top: var(--space-3);
  color: var(--muted);
  font-size: var(--text-sm);
  overflow-wrap: anywhere;
}
.action-group {
  margin-top: var(--space-8);
}
.action-group h3 {
  margin: 0 0 var(--space-4);
  color: var(--muted);
  font-size: var(--text-sm);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
}
/* ActionRail RailButton - icon, label, and the disabled reason it always states. */
.action-button {
  width: 100%;
  min-height: var(--control-height-lg);
  display: flex;
  align-items: center;
  gap: var(--space-5);
  margin-top: var(--space-3);
  padding: 0 var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-primary);
  text-align: left;
  cursor: pointer;
  transition: var(--transition-control);
}
.action-ic { display: flex; color: var(--text-muted); flex: 0 0 auto; }
.action-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.action-button:hover:not([aria-disabled="true"]) { background: var(--bg-hover); }
.action-button:hover:not([aria-disabled="true"]) .action-ic { color: var(--text-accent); }
.action-button[aria-disabled="true"] {
  color: var(--text-disabled);
  cursor: not-allowed;
  background: transparent;
}
.action-button[aria-disabled="true"] .action-ic { color: var(--text-disabled); }
.action-cost {
  color: var(--muted);
  font-size: var(--text-2xs);
  white-space: nowrap;
}
.event-log {
  padding: var(--space-6);
  border-top: 1px solid var(--line-soft);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: var(--leading-snug);
  max-height: 180px;
  overflow: auto;
}
.event-log div { margin-bottom: var(--space-2); overflow-wrap: anywhere; }
/* EventRow tier colours, from the design system's term palette. */
.event-log .instant { color: var(--cw-term-magenta); }
.event-log .fast { color: var(--cw-term-cyan); }
.event-log .error { color: var(--cw-term-red); }
.notice {
  margin-top: var(--space-6);
  padding: var(--space-5);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line-soft);
  color: var(--muted);
  background: var(--bg-surface);
  overflow-wrap: anywhere;
}
.notice.error {
  color: var(--red);
  border-color: color-mix(in srgb, var(--cw-status-offline) 45%, transparent);
  background: var(--danger-soft);
}
.where-panel {
  min-width: 0;
  border-top: 1px solid var(--line-soft);
  padding: var(--space-7) var(--space-7);
  display: grid;
  gap: var(--space-4);
}
.where-panel h3 {
  margin: 0;
  color: var(--muted);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
}
.where-form {
  display: flex;
  gap: var(--space-3);
}
.where-form input {
  flex: 1;
  min-width: 0;
  padding: 0;
  background: none;
  color: var(--text);
  border: none;
  outline: none;
  font-size: var(--text-md);
}
.where-form input::placeholder { color: var(--quiet); }
.where-form button, .log-toolbar button {
  padding: var(--space-4) var(--space-6);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--panel-2);
  color: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.where-form button:hover, .log-toolbar button:hover {
  border-color: var(--border-accent);
  background: var(--bg-hover);
}
.where-results {
  max-height: 180px;
  overflow: auto;
  display: grid;
  gap: var(--space-3);
  align-content: start;
}
.where-row {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--space-1) var(--space-4);
  align-items: center;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-md);
  padding: var(--space-4) var(--space-5);
  background: var(--panel);
}
.where-row .where-name { overflow-wrap: anywhere; }
.where-row .where-meta {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: var(--text-xs);
  overflow-wrap: anywhere;
}
.log-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-5);
  margin-bottom: var(--space-7);
}
/* LogView - a bounded log tail on the terminal surface (term background/foreground). */
pre.log-lines {
  margin: 0;
  padding: var(--space-6);
  background: var(--cw-term-bg);
  color: var(--cw-term-fg);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-md);
  overflow: auto;
  max-height: 320px;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: var(--leading-relaxed);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.log-file {
  color: var(--quiet);
  font-size: var(--text-xs);
  font-weight: var(--weight-regular);
  font-family: var(--font-mono);
}
/* Dialog - a decision with consequences: the overlay surface, its radius and lift. */
dialog {
  background: var(--bg-overlay);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: var(--space-8);
  width: min(440px, calc(100vw - 40px));
  box-shadow: var(--shadow);
}
dialog::backdrop { background: var(--bg-scrim); }
dialog h3 {
  margin: 0 0 var(--space-5);
  font-size: var(--text-lg);
  letter-spacing: var(--tracking-normal);
}
.modal-warning {
  margin: 0;
  padding: var(--space-5);
  color: var(--amber);
  background: color-mix(in srgb, var(--cw-status-degraded) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--cw-status-degraded) 40%, transparent);
  border-radius: var(--radius-lg);
  overflow-wrap: anywhere;
}
.modal-help {
  margin: var(--space-4) 0 0;
  color: var(--muted);
  font-size: var(--text-sm);
}
dialog label {
  display: block;
  margin-top: var(--space-6);
  color: var(--muted);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
}
dialog input {
  display: block;
  width: 100%;
  margin-top: var(--space-3);
  padding: var(--space-4) var(--space-5);
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}
.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-4);
  margin-top: var(--space-7);
}
.modal-buttons button {
  padding: var(--space-4) var(--space-7);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--panel-2);
  color: inherit;
  cursor: pointer;
}
.modal-buttons button:hover:not(:disabled) {
  border-color: var(--border-accent);
  background: var(--bg-hover);
}
.modal-confirm {
  color: var(--accent);
  background: var(--accent-soft);
  border-color: var(--border-accent);
  font-weight: var(--weight-semibold);
}
.modal-confirm:disabled {
  color: var(--quiet);
  background: var(--bg-sunken);
  border-color: var(--line);
  cursor: not-allowed;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------------------------------------------------------------------------
   Design-system component classes, adopted into the no-build Console. Each
   mirrors a design/components primitive's DOM + token styling: Icon, HealthDot,
   TreeItem node, Banner, EmptyState, Spinner, SearchField.
   --------------------------------------------------------------------------- */
.ic { display: block; flex: 0 0 auto; }

/* HealthDot - a bare status dot; unknown slow-pulses rather than sitting green. */
.hdot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-pill);
  flex: 0 0 auto;
}
.hdot.running { background: var(--cw-status-running); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cw-status-running) 14%, transparent); }
.hdot.online { background: var(--cw-status-online); }
.hdot.degraded { background: var(--cw-status-degraded); }
.hdot.offline { background: var(--cw-status-offline); }
.hdot.unknown { background: var(--cw-status-unknown); animation: cw-pulse 1.6s var(--ease-in-out) infinite; }

/* TreeItem node - a type icon plus a stacked label/meta, ellipsised. */
.node { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.node-ic { display: flex; color: var(--text-muted); flex: 0 0 auto; }
.tree-row.selected .node-ic { color: var(--text-accent); }
.node-text { min-width: 0; display: block; }

/* Banner - the typed message; tone sets the tint, `help:` reproduces the CLI envelope. */
.banner {
  display: flex;
  gap: var(--space-5);
  margin-top: var(--space-4);
  padding: var(--space-6);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-hover);
  overflow-wrap: anywhere;
}
.banner-ic { flex: 0 0 auto; margin-top: 1px; }
.banner-body { flex: 1; min-width: 0; }
.banner-title { font: var(--type-body-strong); color: var(--text-primary); }
.banner-text { color: var(--text-secondary); margin-top: var(--space-1); }
.banner-hint { margin-top: var(--space-4); font-family: var(--font-mono); font-size: var(--text-xs); overflow-wrap: anywhere; }
.banner.info { background: color-mix(in srgb, var(--cw-status-online) 10%, transparent); border-color: color-mix(in srgb, var(--cw-status-online) 32%, transparent); }
.banner.info .banner-ic, .banner.info .banner-hint { color: var(--cw-whale-300); }
.banner.success { background: color-mix(in srgb, var(--cw-status-running) 10%, transparent); border-color: color-mix(in srgb, var(--cw-status-running) 32%, transparent); }
.banner.success .banner-ic, .banner.success .banner-hint { color: var(--cw-status-running); }
.banner.warn { background: color-mix(in srgb, var(--cw-status-degraded) 10%, transparent); border-color: color-mix(in srgb, var(--cw-status-degraded) 40%, transparent); }
.banner.warn .banner-ic, .banner.warn .banner-hint { color: var(--cw-status-degraded); }
.banner.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--cw-status-offline) 34%, transparent); }
.banner.danger .banner-ic, .banner.danger .banner-hint { color: var(--cw-status-offline); }

/* EmptyState - the nothing-here surface: icon, what is missing, the command that fixes it. */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-5);
  padding: var(--space-12) var(--space-8);
  text-align: center;
  background: transparent;
  border: 0;
}
.empty-ic { color: var(--text-disabled); }
.empty-title { font: var(--type-heading); color: var(--text-primary); }
.empty-body { color: var(--text-muted); max-width: 400px; }
.empty-cmd {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--text-accent);
  background: var(--bg-sunken);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-4);
}

/* Spinner - the rotating loader over a label, for a pane awaiting data. */
.spinner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-10) var(--space-7);
  text-align: center;
}
.spinner-ic { display: block; color: var(--accent); animation: cw-spin 700ms linear infinite; }
.spinner-label { font: var(--type-body-strong); color: var(--text-primary); }

/* SearchField - the fleet/cache search box: a leading glyph over a sunken field. */
.searchfield {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--space-4);
  height: var(--control-height);
  padding: 0 var(--space-4) 0 var(--space-5);
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  transition: var(--transition-control);
}
.searchfield:focus-within { border-color: var(--border-accent); box-shadow: var(--ring-focus); }
.searchfield .ic { color: var(--text-muted); flex: 0 0 auto; }

@media (max-width: 1050px) {
  .app {
    grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "banner banner"
      "sidebar main"
      "rail rail";
  }
  .rail {
    border-width: 1px 0 0;
    /* The rail is a bottom band here; capping it keeps the tree and detail
       pane usable while the rail scrolls internally past the cap. */
    max-height: 42vh;
  }
  .event-log {
    max-height: 120px;
  }
  .summary-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 760px) {
  .app {
    display: block;
    height: auto;
    min-height: 100vh;
  }
  .sidebar, .rail {
    border-width: 0 0 1px;
  }
  .rail {
    max-height: none;
  }
  .tree {
    max-height: 42vh;
  }
  .topbar, .detail {
    padding-left: var(--space-7);
    padding-right: var(--space-7);
  }
  .tabs {
    padding-left: var(--space-7);
    padding-right: var(--space-7);
  }
}
@media (max-width: 460px) {
  .summary-grid {
    grid-template-columns: 1fr;
  }
  .title-row h2 {
    font-size: var(--text-xl);
  }
}
</style>
</head>
<body>
<div class="app" data-app="cw-console">
  <div id="conn-banner" class="conn-banner" hidden></div>
  <aside class="sidebar" aria-label="Fleet tree">
    <div class="brand">
      <h1>cwcli Console</h1>
      <div class="connection"><span id="conn-dot" class="dot"></span><span id="conn-text">connecting</span></div>
      <button id="doctor-button" class="doctor-button" type="button">Run doctor</button>
    </div>
    <nav id="tree" class="tree"></nav>
    <div id="event-log" class="event-log"></div>
  </aside>
  <main class="main">
    <header id="topbar" class="topbar"></header>
    <div id="tabs" class="tabs" role="tablist" aria-label="Instance details"></div>
    <section id="detail" class="detail" role="tabpanel" tabindex="0" aria-labelledby="tab-processes"></section>
  </main>
  <aside class="rail" aria-label="Actions">
    <div class="rail-head"><h2>Actions</h2></div>
    <div id="rail-body" class="rail-body"></div>
    <div class="where-panel">
      <h3 id="where-title">Fleet search</h3>
      <form id="where-form" class="where-form" aria-labelledby="where-title">
        <span class="searchfield">
          <svg class="ic" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path> <circle cx="11" cy="11" r="8"></circle></svg>
          <input id="where-input" name="q" placeholder="app or site name" autocomplete="off" aria-label="Search cached apps and sites">
        </span>
        <button type="submit">Search</button>
      </form>
      <div id="where-results" class="where-results"><div class="muted">Search the cache for apps and sites</div></div>
    </div>
    <div id="action-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="conn-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </aside>
</div>
<dialog id="modal" aria-labelledby="modal-title">
  <form id="modal-form" method="dialog"><div id="modal-content"></div></form>
</dialog>
<script>
(() => {
  "use strict";

  const model = new Map();
  const detailCache = new Map();
  const logsCache = new Map();
  const expanded = new Set();
  const eventRows = [];
  const tabs = ["processes", "sites", "apps", "logs"];
  const initialFocus = new URLSearchParams(location.search).get("focus");
  let selected = initialFocus ? {type: "instance", project: initialFocus} : {type: "empty"};
  let activeTab = "processes";
  let source = null;
  let activeFocus = null;
  let pendingAction = null;
  let lastAction = null;
  let bootstrapped = false;
  let staleSince = null;

  const el = id => document.getElementById(id);
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
  const unknown = text => `<span class="unknown-text">${esc(text || "unknown")}</span>`;

  // Inline Lucide glyphs, path data copied verbatim from the design system's
  // Icon component (design/components/icons/Icon.jsx). Rendered as the same
  // 24-grid, 1.5px-stroke, currentColor SVG that component emits, so the Console
  // wears the design system's iconography without a build step.
  const ICONS = {
    "server": '<rect width="20" height="8" x="2" y="2" rx="2" ry="2"></rect> <rect width="20" height="8" x="2" y="14" rx="2" ry="2"></rect> <line x1="6" x2="6.01" y1="6" y2="6"></line> <line x1="6" x2="6.01" y1="18" y2="18"></line>',
    "layers": '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path> <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path> <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path>',
    "terminal": '<path d="M12 19h8"></path> <path d="m4 17 6-6-6-6"></path>',
    "play": '<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path>',
    "square": '<rect width="18" height="18" x="3" y="3" rx="2"></rect>',
    "rotate-cw": '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path> <path d="M21 3v5h-5"></path>',
    "refresh-cw": '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path> <path d="M21 3v5h-5"></path> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path> <path d="M8 16H3v5"></path>',
    "zap": '<path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"></path>',
    "tag": '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path> <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle>',
    "git-branch": '<path d="M15 6a9 9 0 0 0-9 9V3"></path> <circle cx="18" cy="6" r="3"></circle> <circle cx="6" cy="18" r="3"></circle>',
    "lock-open": '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect> <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>',
    "globe": '<circle cx="12" cy="12" r="10"></circle> <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path> <path d="M2 12h20"></path>',
    "search": '<path d="m21 21-4.34-4.34"></path> <circle cx="11" cy="11" r="8"></circle>',
    "wrench": '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"></path>',
    "triangle-alert": '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path> <path d="M12 9v4"></path> <path d="M12 17h.01"></path>',
    "circle-alert": '<circle cx="12" cy="12" r="10"></circle> <line x1="12" x2="12" y1="8" y2="12"></line> <line x1="12" x2="12.01" y1="16" y2="16"></line>',
    "info": '<circle cx="12" cy="12" r="10"></circle> <path d="M12 16v-4"></path> <path d="M12 8h.01"></path>',
    "box": '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path> <path d="m3.3 7 8.7 5 8.7-5"></path> <path d="M12 22V12"></path>',
    "scroll-text": '<path d="M15 12h-5"></path> <path d="M15 8h-5"></path> <path d="M19 17V5a2 2 0 0 0-2-2H4"></path> <path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"></path>',
    "loader-circle": '<path d="M21 12a9 9 0 1 1-6.219-8.56"></path>'
  };
  const icon = (name, size = 16) => {
    const d = ICONS[name];
    if (!d) return "";
    return `<svg class="ic" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${d}</svg>`;
  };
  // A bare health dot for dense tree rows (design HealthDot): its own token, and
  // "unknown" slow-pulses rather than sitting green.
  const healthDot = token => {
    const safe = ["running", "degraded", "offline", "online", "unknown"].includes(token) ? token : "unknown";
    return `<span class="hdot ${safe}" title="${esc(safe)}"></span>`;
  };
  // The nothing-here surface (design EmptyState): an icon, what is missing, and
  // - where there is one - the cwcli command that answers it.
  const emptyState = (iconName, title, body, command) =>
    `<div class="empty empty-state">
      <span class="empty-ic">${icon(iconName || "box", 26)}</span>
      <div class="empty-title">${esc(title)}</div>
      ${body ? `<div class="empty-body">${esc(body)}</div>` : ""}
      ${command ? `<code class="empty-cmd">${esc(command)}</code>` : ""}
    </div>`;
  // A typed message with an actionable hint (design Banner): tone sets the
  // colour, the optional help line reproduces the CLI's `help:` envelope.
  const banner = (tone, title, body, hint) => {
    const ic = tone === "danger" ? "circle-alert" : tone === "warn" ? "triangle-alert" : tone === "success" ? "info" : "info";
    return `<div class="banner ${tone || "info"}">
      <span class="banner-ic">${icon(ic, 16)}</span>
      <div class="banner-body">
        ${title ? `<div class="banner-title">${esc(title)}</div>` : ""}
        ${body ? `<div class="banner-text">${esc(body)}</div>` : ""}
        ${hint ? `<div class="banner-hint">help: ${esc(hint)}</div>` : ""}
      </div>
    </div>`;
  };
  // The design Spinner: the rotating loader over a label, for a pane awaiting data.
  const spinner = label =>
    `<div class="spinner"><span class="spinner-ic">${icon("loader-circle", 22)}</span><div class="spinner-label">${esc(label)}</div></div>`;

  const safeKey = value => encodeURIComponent(String(value ?? ""));
  const parseKey = value => decodeURIComponent(value || "");

  function controlFocusKey(node) {
    if (!node || !node.dataset) return null;
    if (node.dataset.toggle !== undefined) return `toggle:${node.dataset.toggle}`;
    if (node.dataset.select !== undefined) {
      return ["select", node.dataset.select, node.dataset.project, node.dataset.bench, node.dataset.process].join(":");
    }
    if (node.dataset.tab !== undefined) return `tab:${node.dataset.tab}`;
    if (node.dataset.action !== undefined) return `action:${node.dataset.action}`;
    if (node.dataset.read !== undefined) return `read:${node.dataset.read}`;
    if (node.dataset.logsRefresh !== undefined) return "logs-refresh";
    return null;
  }

  function restoreControlFocus(container, focusKey, fallbackSelector) {
    if (!focusKey) return;
    const control = [...container.querySelectorAll("button")].find(
      candidate => controlFocusKey(candidate) === focusKey
    );
    if (control) {
      control.focus();
      return;
    }
    // The focused control disappeared (its instance was removed between two
    // renders). Landing keyboard focus on the pane's first control keeps the
    // user's place instead of silently dropping focus to the page body. The
    // key-kind guard stops a pane from stealing focus that belongs to another
    // pane's (still present) control.
    if (fallbackSelector && /^(toggle|select):/.test(focusKey)) {
      const fallback = container.querySelector(fallbackSelector);
      if (fallback) fallback.focus();
    }
  }

  function statusText(token) {
    return ({
      running: "running",
      degraded: "degraded",
      offline: "offline",
      online: "never started",
      unknown: "unknown"
    })[token] || "unknown";
  }

  function statusPill(token) {
    const safe = ["running", "degraded", "offline", "online", "unknown"].includes(token) ? token : "unknown";
    return `<span class="pill ${safe}">${esc(statusText(token))}</span>`;
  }

  function processHealth(process) {
    if (!process) return "unknown";
    const state = process.state;
    if (state === "RUNNING") return "running";
    if (state === "STARTING" || state === "BACKOFF") return "degraded";
    if (state === "STOPPED" || state === "FATAL" || state === "EXITED") return "offline";
    if (state) return "unknown";
    return process.up ? "running" : "offline";
  }

  function processPill(process) {
    if (!process) return `<span class="pill unknown">unknown</span>`;
    if (process.state && process.state !== "RUNNING" && process.state !== "STARTING") {
      return `<span class="pill down">${esc(process.state)}</span>`;
    }
    if (process.up) return `<span class="pill up">${esc(process.state || "up")}</span>`;
    return `<span class="pill down">${esc(process.state || "down")}</span>`;
  }

  function sortedInstances() {
    return [...model.values()].sort((a, b) => a.project.localeCompare(b.project));
  }

  function benchKey(bench) {
    if (!bench) return "";
    return bench.index === null || bench.index === undefined
      ? `path:${bench.bench_path}`
      : `index:${bench.index}`;
  }

  function benchSelector(bench) {
    if (!bench) return null;
    if (bench.label) return bench.label;
    if (bench.index !== null && bench.index !== undefined) return String(bench.index);
    return null;
  }

  function selectedInstance() {
    return selected.project ? model.get(selected.project) || null : null;
  }

  function selectedBench() {
    const inst = selectedInstance();
    if (!inst || !selected.benchKey) return null;
    return inst.benches.find(b => benchKey(b) === selected.benchKey) || null;
  }

  function selectedProcess() {
    const bench = selectedBench();
    if (!bench || !selected.process) return null;
    return bench.processes.find(p => p.label === selected.process) || null;
  }

  function select(next) {
    selected = next;
    activeTab = "processes";
    if (selected.project) {
      expanded.add(selected.project);
      ensureDetail(selected.project);
    }
    render();
    syncFocus();
  }

  function ensureSelection() {
    const instances = sortedInstances();
    if (!instances.length) {
      // Before the first snapshot an empty model means "not asked yet", so a
      // ?focus= selection from the URL must survive until data can answer it.
      if (bootstrapped) selected = {type: "empty"};
      return;
    }
    if (!selected.project || !model.has(selected.project)) {
      selected = {type: "instance", project: instances[0].project};
      expanded.add(instances[0].project);
      ensureDetail(instances[0].project);
      return;
    }
    const inst = selectedInstance();
    if (selected.benchKey && !inst.benches.some(b => benchKey(b) === selected.benchKey)) {
      selected = {type: "instance", project: selected.project};
    }
  }

  function syncFocus() {
    const focus = selected.project || "";
    if (focus === activeFocus && source) return;
    activeFocus = focus;
    connectEvents();
  }

  function connectEvents() {
    if (source) source.close();
    const url = "/api/events" + (activeFocus ? `?focus=${encodeURIComponent(activeFocus)}` : "");
    const es = new EventSource(url);
    source = es;
    setConnection("connecting");
    es.addEventListener("open", () => {
      if (source !== es) return;
      setConnection("connecting");
    });
    es.addEventListener("snapshot", event => {
      if (source !== es) return;
      model.clear();
      JSON.parse(event.data).instances.forEach(instance => {
        model.set(instance.project, instance);
        if (!expanded.has(instance.project)) expanded.add(instance.project);
      });
      bootstrapped = true;
      ensureSelection();
      addEvent("instant", `SNAPSHOT ${model.size} instances`);
      render();
      setConnection("open");
      syncFocus();
    });
    es.addEventListener("delta", event => {
      if (source !== es) return;
      const delta = JSON.parse(event.data);
      if (delta.removed) {
        model.delete(delta.project);
        detailCache.delete(delta.project);
        addEvent(delta.tier, `${delta.tier.toUpperCase()} ${delta.project} removed`);
      } else {
        model.set(delta.project, delta.instance);
        const cause = delta.cause ? ` ${delta.cause.action}(${delta.cause.service || "container"})` : "";
        addEvent(delta.tier, `${delta.tier.toUpperCase()} ${delta.project}${cause} -> ${delta.instance.overall}`);
      }
      ensureSelection();
      render();
      syncFocus();
    });
    es.onerror = () => {
      if (source !== es) return;
      setConnection("reconnecting");
      // A network-level failure keeps EventSource retrying on its own, but a
      // hard failure (non-200, wrong content type) CLOSES it permanently -
      // without this the page would say "reconnecting" forever while nothing
      // retried. Reconnecting from scratch re-bootstraps (the first frame of
      // every connection is a full snapshot), never a replay.
      // Reconnect through the auth gate, not straight into a new stream: a
      // daemon that restarted has a new session id, so this tab's cookie is
      // now stale and retrying the stream alone would spin forever.
      if (es.readyState === EventSource.CLOSED) {
        setTimeout(() => {
          if (source === es && es.readyState === EventSource.CLOSED) startSession();
        }, 3000);
      }
    };
  }

  function setConnection(state) {
    el("conn-text").textContent = activeFocus ? `${state} - focus ${activeFocus}` : state;
    el("conn-dot").className = `dot ${state === "open" ? "open" : "reconnecting"}`;
    // The stale banner distinguishes a LOST connection (was open, data on
    // screen now frozen) from a deliberate refocus reconnect: only the former
    // may present stale rows as if they were live, so only it gets the banner.
    if (state === "open") {
      if (staleSince !== null) el("conn-status").textContent = "Connection restored - live again.";
      staleSince = null;
    } else if (state === "reconnecting" && staleSince === null && model.size) {
      staleSince = new Date().toLocaleTimeString();
      el("conn-status").textContent =
        "Connection to cwcli serve lost - showing last known state, not live.";
    }
    const stale = staleSince !== null;
    el("conn-banner").hidden = !stale;
    el("conn-banner").textContent = stale
      ? `Connection lost - reconnecting. Showing last known state from ${staleSince}, not live data.`
      : "";
    document.querySelector(".app").classList.toggle("stale", stale);
  }

  function addEvent(kind, text) {
    if (eventRows[0] && eventRows[0].kind === kind && eventRows[0].text === text) return;
    eventRows.unshift({kind, text, at: new Date().toLocaleTimeString()});
    eventRows.splice(60);
    renderEvents();
  }

  function renderEvents() {
    el("event-log").innerHTML = eventRows.length
      ? eventRows.map(row => `<div class="${esc(row.kind)}">${esc(row.at)} ${esc(row.text)}</div>`).join("")
      : `<div class="muted">No stream events yet</div>`;
  }

  function ensureDetail(project) {
    const cached = detailCache.get(project);
    if (cached && cached.state !== "error") return;
    detailCache.set(project, {state: "loading"});
    fetch(`/api/instance/${encodeURIComponent(project)}/detail`)
      .then(async response => {
        const body = await response.json();
        if (!response.ok) throw body;
        detailCache.set(project, {state: "ready", data: body});
        render();
      })
      .catch(error => {
        const message = error && error.error ? error.error.message : "could not find out";
        detailCache.set(project, {state: "error", message});
        render();
      });
  }

  function currentDetail() {
    return selected.project ? detailCache.get(selected.project) || null : null;
  }

  function render() {
    ensureSelection();
    renderTree();
    renderTopbar();
    renderTabs();
    renderDetail();
    renderRail();
    renderEvents();
  }

  function renderTree() {
    const focusKey = controlFocusKey(document.activeElement);
    const instances = sortedInstances();
    if (!instances.length) {
      // "No instances found" is a claim only a snapshot can back; before one
      // arrives (or when the daemon was never reachable) the honest message
      // is that we could not find out yet.
      el("tree").innerHTML = bootstrapped
        ? emptyState("server", "No instances found", "No local Frappe instances are running.", "cwcli init <name>")
        : emptyState("box", "Waiting for the daemon - no fleet data yet");
      return;
    }
    el("tree").innerHTML = instances.map(instance => {
      const open = expanded.has(instance.project);
      const instanceSelected = selected.type === "instance" && selected.project === instance.project;
      const benches = open ? instance.benches.map(bench => renderBenchNode(instance, bench)).join("") : "";
      const pending = instance.overall === "unknown" ? " - could not find out yet" : "";
      return `<div class="instance-group">
        <div class="tree-line">
          <button class="twisty" data-toggle="${safeKey(instance.project)}" aria-expanded="${open ? "true" : "false"}" aria-label="${open ? "Collapse" : "Expand"} ${esc(instance.project)}">${open ? "&#9662;" : "&#9656;"}</button>
          <button class="tree-row ${instanceSelected ? "selected" : ""}" data-select="instance" data-project="${safeKey(instance.project)}"${instanceSelected ? ' aria-current="true"' : ""}>
            <span class="node">
              <span class="node-ic">${icon("server", 14)}</span>
              <span class="node-text">
                <span class="tree-label">${esc(instance.project)}</span>
                <span class="tree-meta">${esc(instance.docker_status)}${esc(pending)}</span>
              </span>
            </span>
            ${healthDot(instance.overall)}
          </button>
        </div>
        ${open ? `<div class="children">${benches || renderNoBenchNode(instance)}</div>` : ""}
      </div>`;
    }).join("");
    restoreControlFocus(el("tree"), focusKey, ".tree-row");
  }

  function renderBenchNode(instance, bench) {
    const key = benchKey(bench);
    const selectedRow = selected.project === instance.project && selected.benchKey === key && selected.type === "bench";
    const meta = bench.not_cwcli_supervised ? "not cwcli supervised" : webSummary(bench, instance.web_probed);
    const processes = (bench.processes || []).map(process => renderProcessNode(instance, bench, process)).join("");
    return `<div>
      <button class="tree-row bench ${selectedRow ? "selected" : ""}" data-select="bench" data-project="${safeKey(instance.project)}" data-bench="${safeKey(key)}"${selectedRow ? ' aria-current="true"' : ""}>
        <span class="node">
          <span class="node-ic">${icon("layers", 14)}</span>
          <span class="node-text">
            <span class="tree-label">${esc(bench.label || bench.bench_path)}</span>
            <span class="tree-meta">${esc(meta)}</span>
          </span>
        </span>
        ${healthDot(bench.overall)}
      </button>
      <div class="children">${processes || `<div class="tree-meta">processes unknown</div>`}</div>
    </div>`;
  }

  function renderProcessNode(instance, bench, process) {
    const selectedRow = selected.project === instance.project
      && selected.benchKey === benchKey(bench)
      && selected.process === process.label
      && selected.type === "process";
    return `<button class="tree-row process ${selectedRow ? "selected" : ""}" data-select="process" data-project="${safeKey(instance.project)}" data-bench="${safeKey(benchKey(bench))}" data-process="${safeKey(process.label)}"${selectedRow ? ' aria-current="true"' : ""}>
      <span class="node">
        <span class="node-ic">${icon("terminal", 13)}</span>
        <span class="node-text">
          <span class="tree-label">PROCESS ${esc(process.label)}</span>
          <span class="tree-meta">${esc(process.pid == null ? "pid unknown" : "pid " + process.pid)}</span>
        </span>
      </span>
      ${healthDot(processHealth(process))}
    </button>`;
  }

  function renderNoBenchNode(instance) {
    const text = instance.container_running ? "health unknown - no bench probed" : "instance offline";
    return `<div class="tree-meta">${esc(text)}</div>`;
  }

  function renderTopbar() {
    const inst = selectedInstance();
    if (!inst) {
      el("topbar").innerHTML = `<div class="crumb">fleet</div><div class="title-row"><h2>No instance selected</h2>${statusPill("unknown")}</div>`;
      return;
    }
    const bench = selectedBench();
    const process = selectedProcess();
    let title = inst.project;
    let crumb = "fleet / " + inst.project;
    let token = inst.overall;
    let subtitle = instanceSubtitle(inst);
    if (bench) {
      title = bench.label || bench.bench_path;
      crumb += " / " + title;
      token = bench.overall;
      subtitle = benchSubtitle(bench, inst);
    }
    if (process) {
      title = "PROCESS " + process.label;
      crumb += " / PROCESS " + process.label;
      subtitle = processSubtitle(process, bench);
    }
    el("topbar").innerHTML = `<div class="crumb">${esc(crumb)}</div>
      <div class="title-row"><h2>${esc(title)}</h2>${process ? processPill(process) : statusPill(token)}</div>
      <div class="subtitle">${subtitle}</div>`;
  }

  function instanceSubtitle(instance) {
    const bits = [
      `Docker ${instance.docker_status}`,
      instance.container_running ? "container running" : "container stopped",
      instance.probe_ms == null ? "probe never completed" : `last probe ${Math.round(instance.probe_ms)}ms`
    ];
    if (instance.probe_error) bits.push("probe error: " + instance.probe_error);
    return bits.map(esc).join(" · ");
  }

  function benchSubtitle(bench, instance) {
    const bits = [benchStatusSentence(bench), webSummary(bench, instance.web_probed)];
    if (bench.not_cwcli_supervised) bits.push("not cwcli supervised");
    return bits.map(esc).join(" · ");
  }

  function processSubtitle(process, bench) {
    const state = process.state || (bench && bench.not_cwcli_supervised ? "supervisord state unknown" : "state unknown");
    const pid = process.pid == null ? "pid unknown" : "pid " + process.pid;
    return [state, pid, process.up ? "process up" : "process down"].map(esc).join(" · ");
  }

  function benchStatusSentence(bench) {
    if (bench.overall === "online") return "never started";
    if (bench.overall === "unknown") return "could not find out";
    return bench.overall;
  }

  function webSummary(bench, instanceWebProbed) {
    if (!bench.web_port_verified) return "port unknown, not probed";
    if (bench.web_port === null || bench.web_port === undefined) return "port unknown, not probed";
    if (!instanceWebProbed) return `:${bench.web_port} not probed`;
    if (bench.web_http_code === null || bench.web_http_code === undefined) {
      return `${bench.web_site || "site unknown"}:${bench.web_port} -> no answer`;
    }
    return `${bench.web_site || "site unknown"}:${bench.web_port} -> ${bench.web_http_code}`;
  }

  function renderTabs() {
    const focusKey = controlFocusKey(document.activeElement);
    el("tabs").innerHTML = tabs.map(tab => {
      const label = tab === "sites" ? "Sites <small>cached</small>"
        : tab === "apps" ? "Apps <small>cached</small>"
        : tab === "logs" ? "Logs <small>live</small>"
        : "Processes";
      const selectedTab = activeTab === tab;
      return `<button id="tab-${tab}" class="tab ${selectedTab ? "active" : ""}" role="tab" data-tab="${tab}" aria-selected="${selectedTab ? "true" : "false"}" aria-controls="detail" tabindex="${selectedTab ? "0" : "-1"}">${label}</button>`;
    }).join("");
    el("detail").setAttribute("aria-labelledby", `tab-${activeTab}`);
    restoreControlFocus(el("tabs"), focusKey);
  }

  function renderDetail() {
    if (activeTab === "sites") {
      renderSites();
    } else if (activeTab === "apps") {
      renderApps();
    } else if (activeTab === "logs") {
      renderLogs();
    } else {
      renderProcesses();
    }
  }

  function renderProcesses() {
    const inst = selectedInstance();
    if (!inst) {
      el("detail").innerHTML = emptyState("server", "No live fleet data", "No probe has answered for the fleet yet.");
      return;
    }
    const benches = selectedBench() ? [selectedBench()] : inst.benches;
    const process = selectedProcess();
    const summary = `<div class="summary-grid">
      ${metric("Instance", inst.project)}
      ${metric("Health", statusText(inst.overall))}
      ${metric("Docker", inst.docker_status)}
      ${metric("Probe", inst.probe_ms == null ? "never completed" : Math.round(inst.probe_ms) + "ms")}
    </div>`;
    if (process) {
      el("detail").innerHTML = summary + renderProcessCard(process, selectedBench());
      return;
    }
    if (!benches.length) {
      el("detail").innerHTML = summary + (inst.container_running
        ? emptyState("box", "Health unknown - no bench probed yet")
        : emptyState("server", "Instance offline", "Start the instance to probe its benches.", "cwcli start " + inst.project));
      return;
    }
    const rows = benches.flatMap(bench => (bench.processes || []).map(process => ({bench, process})));
    if (!rows.length) {
      el("detail").innerHTML = summary + emptyState("box", "Process state unknown - could not find out");
      return;
    }
    el("detail").innerHTML = summary + `<div class="section"><h3>Processes</h3><div class="table-wrap"><table>
      <thead><tr><th>Bench</th><th>Process</th><th>State</th><th>PID</th><th>CPU</th><th>Memory</th><th>Uptime</th></tr></thead>
      <tbody>${rows.map(({bench, process}) => `<tr>
        <td class="code">${esc(bench.label || bench.bench_path)}</td>
        <td class="code">PROCESS ${esc(process.label)}</td>
        <td>${processPill(process)}</td>
        <td>${process.pid == null ? unknown("unknown") : esc(process.pid)}</td>
        <td>${process.cpu_pct == null ? unknown("unknown") : esc(process.cpu_pct + "%")}</td>
        <td>${process.rss_kb == null ? unknown("unknown") : esc(Math.round(process.rss_kb / 1024) + " MB")}</td>
        <td>${process.uptime_s == null ? unknown("unknown") : esc(formatDuration(process.uptime_s))}</td>
      </tr>`).join("")}</tbody>
    </table></div></div>`;
  }

  function renderProcessCard(process, bench) {
    return `<div class="summary-grid">
      ${metric("Process", "PROCESS " + process.label)}
      ${metric("State", process.state || "unknown")}
      ${metric("PID", process.pid == null ? "unknown" : process.pid)}
      ${metric("Bench", bench ? (bench.label || bench.bench_path) : "unknown")}
    </div>`;
  }

  function metric(label, value) {
    const text = value === null || value === undefined || value === "" ? "unknown" : String(value);
    return `<div class="metric"><div class="label">${esc(label)}</div><div class="value">${esc(text)}</div></div>`;
  }

  function formatDuration(seconds) {
    if (seconds < 60) return `${seconds}s`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    return `${hours}h ${minutes % 60}m`;
  }

  function detailBenches() {
    const detail = currentDetail();
    if (!detail || detail.state !== "ready") return [];
    if (!selected.benchKey) return detail.data.benches || [];
    return (detail.data.benches || []).filter(bench => {
      const key = bench.index === null || bench.index === undefined ? `path:${bench.path}` : `index:${bench.index}`;
      return key === selected.benchKey;
    });
  }

  function renderDetailState(kind) {
    const detail = currentDetail();
    if (!selected.project) return emptyState("box", "No instance selected", "Choose an instance from the fleet tree.");
    if (!detail || detail.state === "loading") return spinner(`Loading cached ${kind}`);
    if (detail.state === "error") return banner("danger", "Could not load cached " + kind, detail.message || "could not find out");
    return null;
  }

  function renderSites() {
    const state = renderDetailState("sites");
    if (state) {
      el("detail").innerHTML = state;
      return;
    }
    const detail = currentDetail().data;
    const benches = detailBenches();
    const freshness = metric("Inspect freshness", detail.served_from || "unknown");
    const blocks = benches.map(bench => {
      const sites = bench.sites || [];
      return `<div class="inventory-block">
        <div class="inventory-title"><span>${esc(bench.label || bench.path)}</span><span class="pill neutral">cached</span></div>
        <div class="tree-meta">${esc(benchDetailMeta(bench))}</div>
        ${sites.length ? `<div class="table-wrap"><table><thead><tr><th>Site</th><th>Default</th><th>Config</th><th>Apps</th></tr></thead><tbody>
          ${sites.map(site => `<tr>
            <td class="code">${esc(site.name)}</td>
            <td>${site.name === bench.default_site ? "default" : `<span class="muted">not default</span>`}</td>
            <td>${site.has_site_config ? "present" : unknown("unknown")}</td>
            <td>${site.installed_apps_verified ? "verified" : unknown("remembered - could not verify")}</td>
          </tr>`).join("")}
        </tbody></table></div>` : `<div class="empty">No sites in cached inspect result</div>`}
      </div>`;
    }).join("");
    el("detail").innerHTML = `<div class="summary-grid">${freshness}${metric("Project", detail.project)}${metric("Benches", benches.length)}${metric("State", detail.degraded ? "degraded" : "cached")}</div>
      <div class="site-apps">${blocks || `<div class="empty">No cached bench detail</div>`}</div>`;
  }

  function renderApps() {
    const state = renderDetailState("apps");
    if (state) {
      el("detail").innerHTML = state;
      return;
    }
    const detail = currentDetail().data;
    const benches = detailBenches();
    const blocks = benches.map(bench => {
      const available = bench.available_apps || [];
      const sites = bench.sites || [];
      const installedRows = sites.flatMap(site => (site.installed_apps || []).map(app => ({site, app})));
      return `<div class="inventory-block">
        <div class="inventory-title"><span>${esc(bench.label || bench.path)}</span><span class="pill neutral">cached</span></div>
        <div class="tree-meta">${esc(benchDetailMeta(bench))}</div>
        <div class="section"><h3>Available apps</h3><div class="chips">${available.length ? available.map(app => `<span class="chip">${esc(app)}</span>`).join("") : unknown("could not find out")}</div></div>
        <div class="section"><h3>Installed apps</h3>
          ${installedRows.length ? `<div class="table-wrap"><table><thead><tr><th>Site</th><th>App</th><th>Version</th><th>Branch</th><th>Verification</th></tr></thead><tbody>
            ${installedRows.map(row => {
              const app = appParts(row.app);
              return `<tr>
                <td class="code">${esc(row.site.name)}</td>
                <td class="code">${esc(app.name)}</td>
                <td class="code">${app.version ? esc(app.version) : `<span class="muted">not recorded</span>`}</td>
                <td class="code">${app.branch ? esc(app.branch) : `<span class="muted">not recorded</span>`}</td>
                <td>${row.site.installed_apps_verified ? "verified" : unknown("remembered - could not verify")}</td>
              </tr>`;
            }).join("")}
          </tbody></table></div>` : `<div class="empty">No installed apps in cached inspect result</div>`}
        </div>
      </div>`;
    }).join("");
    el("detail").innerHTML = `<div class="summary-grid">${metric("Inspect freshness", detail.served_from || "unknown")}${metric("Project", detail.project)}${metric("Benches", benches.length)}${metric("Apps", countApps(benches))}</div>
      <div class="site-apps">${blocks || `<div class="empty">No cached app detail</div>`}</div>`;
  }

  function benchDetailMeta(bench) {
    const where = `path ${bench.path || "unknown"}`;
    const def = bench.default_site ? `default site ${bench.default_site}` : "no default site recorded";
    return `${where} · ${def}`;
  }

  function appParts(entry) {
    // Each cached installed-app entry is "name version branch" from bench
    // list-apps; older cache rows may carry the name alone. Absent parts render
    // as "not recorded" - never invented.
    const parts = String(entry || "").trim().split(/\s+/);
    return {name: parts[0] || "", version: parts[1] || "", branch: parts.slice(2).join(" ")};
  }

  function logsKey() {
    return `${selected.project}|${selected.benchKey || ""}`;
  }

  async function fetchLogs() {
    if (!selected.project) return;
    const key = logsKey();
    const previous = logsCache.get(key);
    if (previous && previous.state === "loading") return;
    logsCache.set(key, {state: "loading"});
    if (activeTab === "logs") renderDetail();
    const params = new URLSearchParams({lines: "200"});
    const selector = benchSelector(selectedBench());
    if (selector) params.set("bench", selector);
    const project = selected.project;
    try {
      const response = await fetch(`/api/instance/${encodeURIComponent(project)}/logs?${params}`);
      const body = await response.json();
      if (!response.ok || !body.ok) {
        const error = body.error || {};
        const benches = body.choice && body.choice.options
          ? " Benches: " + body.choice.options.map(o => o.label || o.value).join(", ")
          : "";
        throw new Error((error.message || "could not find out") + benches);
      }
      logsCache.set(key, {
        state: "ready",
        data: body.outcome,
        warnings: body.warnings || [],
        at: new Date().toLocaleTimeString()
      });
    } catch (error) {
      logsCache.set(key, {state: "error", message: error.message || "could not find out"});
    }
    if (activeTab === "logs" && logsKey() === key) renderDetail();
  }

  function renderLogs() {
    const focusKey = controlFocusKey(document.activeElement);
    if (!selected.project) {
      el("detail").innerHTML = `<div class="empty">No instance selected</div>`;
      return;
    }
    const entry = logsCache.get(logsKey());
    const toolbar = when => `<div class="log-toolbar">
      <span class="muted">${esc(when)}</span>
      <button data-logs-refresh>Refresh</button>
    </div>`;
    if (!entry || entry.state === "loading") {
      el("detail").innerHTML = spinner("Loading logs");
      return;
    }
    if (entry.state === "error") {
      el("detail").innerHTML = toolbar("logs read failed") + banner("danger", "Logs read failed", entry.message || "could not find out");
      restoreControlFocus(el("detail"), focusKey);
      return;
    }
    const read = entry.data || {};
    const warn = (entry.warnings || [])
      .map(w => banner("warn", null, w.text || w.code || "")).join("");
    // bench's own tools colorize freely; in a <pre> those ANSI codes would
    // render as literal escape garbage, so they are stripped, not interpreted.
    const stripAnsi = line => String(line).replace(/\u001b\[[0-9;]*[A-Za-z]/g, "");
    const blocks = (read.logs || []).map(group => `<div class="section">
      <h3>PROCESS ${esc(group.process)} <span class="log-file">${esc(group.file)}</span></h3>
      <pre class="log-lines">${esc((group.lines || []).map(stripAnsi).join("\n"))}</pre>
    </div>`).join("");
    el("detail").innerHTML = toolbar(`fetched ${entry.at} · last ${read.lines_requested || "?"} lines per process`)
      + `<div class="summary-grid">
        ${metric("Bench", read.bench_path)}
        ${metric("Container", read.container_name)}
        ${metric("Processes", (read.logs || []).length)}
        ${metric("Supervision", read.not_cwcli_supervised ? "raw bench logs - not cwcli supervised" : "cwcli supervisord")}
      </div>`
      + warn
      + (blocks || emptyState("scroll-text", "No logs written yet", "This bench is running but has written nothing to its logs yet."));
    restoreControlFocus(el("detail"), focusKey);
  }

  function countApps(benches) {
    const names = new Set();
    benches.forEach(bench => {
      (bench.available_apps || []).forEach(name => names.add(name));
      (bench.sites || []).forEach(site => (site.installed_apps || []).forEach(name => names.add(name)));
    });
    return names.size;
  }

  function renderRail() {
    const focusKey = controlFocusKey(document.activeElement);
    const inst = selectedInstance();
    if (!inst) {
      el("rail-body").innerHTML = `<div class="target"><div class="target-name">No target</div><div class="target-meta">unknown</div></div>`;
      return;
    }
    const bench = selectedBench();
    const process = selectedProcess();
    const targetName = process ? `PROCESS ${process.label}` : bench ? (bench.label || bench.bench_path) : inst.project;
    const targetMeta = process ? `${inst.project} / ${bench ? bench.bench_path : "bench unknown"}` : bench ? inst.project : "instance";
    const busy = pendingAction !== null;
    const processDisabled = busy || !process;
    const message = lastAction ? banner(lastAction.ok ? "success" : "danger", null, lastAction.text) : "";
    el("rail-body").innerHTML = `<div>
      <div class="target"><div class="target-name">${esc(targetName)}</div><div class="target-meta">${esc(targetMeta)}</div></div>
      <div class="action-group">
        <h3>Instance</h3>
        ${actionButton("start_instance", "Start instance", "starts bench", busy, "play")}
        ${actionButton("stop_instance", "Stop instance", "stops containers", busy, "square")}
        ${actionButton("restart_instance", "Restart instance", "stop then start", busy, "rotate-cw")}
        ${actionButton("refresh_status", "Refresh status", "re-probe health", busy, "refresh-cw")}
        ${actionButton("scale_instance", "Scale ports…", "asks to confirm", busy, "zap")}
      </div>
      <div class="action-group">
        <h3>Bench</h3>
        ${actionButton("set_label", "Set label…", "durable handle", busy, "tag")}
        ${actionButton("checkout_app", "Check out app ref…", "fetch + checkout", busy, "git-branch")}
      </div>
      <div class="action-group">
        <h3>Site</h3>
        ${actionButton("unlock_site", "Unlock site…", "removes locks", busy, "lock-open")}
      </div>
      <div class="action-group">
        <h3>Process</h3>
        ${actionButton("restart_process", "Restart process", process ? "one process" : "select process", processDisabled, "rotate-cw")}
      </div>
      <div class="action-group">
        <h3>Read</h3>
        ${readButton("url", "Check URL", "host + reachability", busy, "globe")}
      </div>
      <!-- Later-phase mutation groups attach here as new action-group blocks;
           they are deliberately not rendered until their phase ships, because a
           greyed-out button for a not-yet-shipped verb still counts as building
           its surface (the Tier A rail ruling, pinned in test_serve_frontend). -->
      ${message}
    </div>`;
    restoreControlFocus(el("rail-body"), focusKey);
  }

  function actionButton(action, label, cost, disabled, iconName) {
    const busy = pendingAction === action ? "working" : cost;
    return `<button class="action-button" data-action="${action}" aria-disabled="${disabled ? "true" : "false"}">
      <span class="action-ic">${icon(iconName || "zap", 15)}</span><span class="action-label">${esc(label)}</span><span class="action-cost">${esc(busy)}</span>
    </button>`;
  }

  // A READ, not a Tier A action - kept off the actionButton() surface so the
  // pinned action-set stays exact. Its own data-read handler dispatches it.
  function readButton(read, label, cost, disabled, iconName) {
    const busy = pendingAction === "probe_" + read ? "working" : cost;
    return `<button class="action-button" data-read="${read}" aria-disabled="${disabled ? "true" : "false"}">
      <span class="action-ic">${icon(iconName || "globe", 15)}</span><span class="action-label">${esc(label)}</span><span class="action-cost">${esc(busy)}</span>
    </button>`;
  }

  const benchScopedActions = ["start_instance", "restart_instance", "restart_process", "set_label", "unlock_site", "checkout_app"];

  async function runAction(action, extra, targetProject) {
    const inst = targetProject ? model.get(targetProject) || null : selectedInstance();
    if (!inst || pendingAction) return;
    const bench = selectedBench();
    const process = selectedProcess();
    const payload = Object.assign({action, project: inst.project}, extra || {});
    const selector = benchSelector(bench);
    if (selector && benchScopedActions.includes(action)) {
      payload.bench = selector;
    }
    if (action === "restart_process") {
      if (!process) return;
      payload.process = process.label;
    }
    pendingAction = action;
    lastAction = null;
    renderRail();
    el("action-status").textContent = `${action.replaceAll("_", " ")} in progress for ${inst.project}`;
    try {
      const response = await fetch("/api/action", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      const body = await response.json();
      if (!response.ok || !body.ok) {
        const error = body.error || {};
        if (response.status === 409 && error.kind === "needs_choice" && error.code === "confirm_scale") {
          // The confirm arrives FROM CORE: core.scale returned NEEDS_CHOICE
          // because consent was not given, and its own words describe the blast
          // radius. The page never invents this warning; it only relays it and
          // requires the typed project name before retrying with consent.
          openScaleConfirm(payload.project, error.message || "Scaling needs confirmation.", payload.to);
          return;
        }
        const choice = body.choice && body.choice.options ? " Options: " + body.choice.options.map(o => o.label || o.value).join(", ") : "";
        throw new Error((error.message || "action failed") + choice);
      }
      lastAction = {ok: true, text: `${action.replaceAll("_", " ")} accepted for ${inst.project}`};
      addEvent("fast", `ACTION ${action.replaceAll("_", " ")} ${inst.project}`);
      if (action === "set_label" || action === "checkout_app") {
        // The bench label / app registry just changed; the cached detail no
        // longer describes it.
        detailCache.delete(inst.project);
        ensureDetail(inst.project);
      }
    } catch (error) {
      lastAction = {ok: false, text: error.message || "action failed"};
