<!-- @dsCard group="Colors" viewport="700x120" name="Ink & deep water" subtitle="The mark's outline navy — every surface in the app sits on this ramp" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="g" style="grid-template-columns:repeat(6,1fr)">
<div class="sw" style="background:var(--cw-abyss);color:#c0e0f0"><b>abyss</b><i>var(--cw-abyss)</i></div><div class="sw" style="background:var(--cw-ink-900);color:#c0e0f0"><b>ink 900</b><i>var(--cw-ink-900)</i></div><div class="sw" style="background:var(--cw-ink-800);color:#c0e0f0"><b>ink 800</b><i>var(--cw-ink-800)</i></div><div class="sw" style="background:var(--cw-ink-700);color:#c0e0f0"><b>ink 700</b><i>var(--cw-ink-700)</i></div><div class="sw" style="background:var(--cw-deep-500);color:#e0f0ff"><b>deep 500</b><i>var(--cw-deep-500)</i></div><div class="sw" style="background:var(--cw-deep-400);color:#e0f0ff"><b>deep 400</b><i>var(--cw-deep-400)</i></div>
</div>
</body></html>
