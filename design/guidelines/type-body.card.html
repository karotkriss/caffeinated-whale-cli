<!-- @dsCard group="Type" viewport="700x160" name="Body & meta" subtitle="13px is the workhorse; 12px carries every label and hint" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div style="font:var(--type-body);max-width:520px">The container is up, which is not the same as a bench that serves. Health stays unknown until a probe answers.</div>
<div style="font:var(--type-body-strong);margin-top:8px">Restart process</div>
<div style="font:var(--type-meta);color:var(--text-secondary);margin-top:8px">Select a process in the tree first.</div>
<div style="font:var(--type-meta);color:var(--text-muted);margin-top:4px">This deletes the database. There is no undo.</div>
<div style="font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted);margin-top:10px">13px / 1.5 body · 12px / 1.35 meta</div>
</body></html>
