<!-- @dsCard group="Brand" viewport="700x150" name="Interaction states" subtitle="Hover tints, a 2px focus ring, a half-pixel press, a left bar for selection" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="row" style="gap:14px">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:96px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);background:transparent">web</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">rest</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:96px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);background:var(--bg-hover)">web</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">hover</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:96px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);background:var(--bg-active)">web</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">active</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:96px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);background:var(--bg-selected);box-shadow:var(--ring-selected)">web</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">selected</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:96px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);background:transparent;box-shadow:var(--ring-focus)">web</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">focus</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:96px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);background:transparent;opacity:.42">web</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">disabled</span></div>
</div>
<p style="margin:14px 0 0;font:var(--type-meta);color:var(--text-muted)">No scale transforms, no shadows on hover, no colour change on press — only a 0.5px nudge.</p>
</body></html>
