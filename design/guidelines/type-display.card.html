<!-- @dsCard group="Type" viewport="700x170" name="Display & title" subtitle="IBM Plex Sans SemiBold, tightened. Used only in splash, dialogs and empty states" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div style="font:var(--type-display);letter-spacing:var(--tracking-tight)">Caffeinated Whale</div>
<div style="font:var(--type-title);letter-spacing:var(--tracking-tight);margin-top:10px">Remove this instance?</div>
<div style="font:var(--type-heading);margin-top:8px">No instances on this Docker daemon</div>
<div style="font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted);margin-top:10px">34 / 20 / 16 px · weight 600 · tracking −0.02em</div>
</body></html>
