<!-- @dsCard group="Colors" viewport="700x120" name="Sea foam & clay" subtitle="Foam whites carry text; the cup's clay is the only warm colour in the system" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="g" style="grid-template-columns:repeat(7,1fr)">
<div class="sw" style="background:var(--cw-foam-100);color:#0a0f22"><b>foam 100</b><i>var(--cw-foam-100)</i></div><div class="sw" style="background:var(--cw-foam-200);color:#0a0f22"><b>foam 200</b><i>var(--cw-foam-200)</i></div><div class="sw" style="background:var(--cw-foam-300);color:#0a0f22"><b>foam 300</b><i>var(--cw-foam-300)</i></div><div class="sw" style="background:var(--cw-foam-400);color:#0a0f22"><b>foam 400</b><i>var(--cw-foam-400)</i></div><div class="sw" style="background:var(--cw-clay-400);color:#1a0705"><b>clay 400</b><i>var(--cw-clay-400)</i></div><div class="sw" style="background:var(--cw-clay-500);color:#1a0705"><b>clay 500</b><i>var(--cw-clay-500)</i></div><div class="sw" style="background:var(--cw-clay-800);color:#f0ffff"><b>clay 800</b><i>var(--cw-clay-800)</i></div>
</div>
</body></html>
