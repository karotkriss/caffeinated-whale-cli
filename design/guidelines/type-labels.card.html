<!-- @dsCard group="Type" viewport="700x120" name="Section labels" subtitle="10px semibold, uppercase, +0.09em — the only place capitals are used" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="lb">Fleet</div>
<div class="lb" style="margin-top:8px">Not in the safe set</div>
<div class="lb" style="margin-top:8px">Installed apps · verified from the bench, not the cache</div>
<div style="font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted);margin-top:12px">Never uppercase a sentence, a status token, or a process name.</div>
</body></html>
