<!-- @dsCard group="Type" viewport="700x170" name="Monospace" subtitle="JetBrains Mono. Every value a machine produced, and every word the CLI prints" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div style="font:var(--type-mono);font-size:var(--text-md)">/workspace/development/frappe-bench</div>
<div style="font:var(--type-mono);font-size:var(--text-md);color:var(--cw-term-cyan)">my-erp</div>
<div style="font:var(--type-mono);font-size:var(--text-md);color:var(--cw-status-running)">web  RUNNING  pid 4711</div>
<div style="font:var(--type-mono);font-size:var(--text-md);color:var(--text-muted)">worker_default  STOPPED  pid —</div>
<div style="font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted);margin-top:10px">Ports · pids · paths · sites · branches · states · anything the daemon measured</div>
</body></html>
