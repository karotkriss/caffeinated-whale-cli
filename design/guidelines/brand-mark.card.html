<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="row" style="gap:22px;align-items:center">
<img src="../assets/logo-whale.png" alt="Caffeinated Whale" width="150" height="150" style="display:block">
<div style="display:flex;flex-direction:column;gap:12px">
<div class="row" style="gap:10px;align-items:center"><img src="../assets/logo-whale.png" alt="" width="44" height="44"><span style="font:var(--type-title);letter-spacing:var(--tracking-tight)">Caffeinated Whale</span></div>
<div class="row" style="gap:8px;align-items:center"><img src="../assets/logo-whale.png" alt="" width="20" height="20"><span style="font:var(--type-body-strong);font-size:var(--text-sm)">Caffeinated Whale</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">title bar · 20px</span></div>
<p style="margin:0;font:var(--type-meta);color:var(--text-muted);max-width:330px">The illustration is the only decorative image in the product. It appears in the title bar, the splash, and nowhere else in the app chrome.</p>
</div></div>
</body></html>
