<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="g" style="grid-template-columns:repeat(5,1fr)">
<div class="sw" style="background:var(--cw-whale-700);color:#04121c"><b>700</b><i>var(--cw-whale-700)</i></div><div class="sw" style="background:var(--cw-whale-600);color:#04121c"><b>600</b><i>var(--cw-whale-600)</i></div><div class="sw" style="background:var(--cw-whale-500);color:#04121c"><b>500 · accent</b><i>var(--cw-whale-500)</i></div><div class="sw" style="background:var(--cw-whale-400);color:#04121c"><b>400</b><i>var(--cw-whale-400)</i></div><div class="sw" style="background:var(--cw-whale-300);color:#04121c"><b>300</b><i>var(--cw-whale-300)</i></div>
</div>
</body></html>
