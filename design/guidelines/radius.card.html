<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="row">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:56px;height:44px;background:var(--bg-surface-raised);border:1px solid var(--border-default);border-radius:3px"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">xs 3px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:56px;height:44px;background:var(--bg-surface-raised);border:1px solid var(--border-default);border-radius:4px"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">sm 4px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:56px;height:44px;background:var(--bg-surface-raised);border:1px solid var(--border-default);border-radius:6px"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">md 6px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:56px;height:44px;background:var(--bg-surface-raised);border:1px solid var(--border-default);border-radius:8px"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">lg 8px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:56px;height:44px;background:var(--bg-surface-raised);border:1px solid var(--border-default);border-radius:12px"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">xl 12px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:56px;height:44px;background:var(--bg-surface-raised);border:1px solid var(--border-default);border-radius:10px"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">window 10px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:56px;height:44px;background:var(--bg-surface-raised);border:1px solid var(--border-default);border-radius:999px"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">pill 999px</span></div>
</div>
</body></html>
