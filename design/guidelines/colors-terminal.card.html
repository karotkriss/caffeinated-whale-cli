<!-- @dsCard group="Colors" viewport="700x140" name="Terminal palette" subtitle="What Rich prints, mapped to pixels. Log views and CLI mocks use only these" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div style="background:var(--cw-term-bg);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px 14px;font-family:var(--font-mono);font-size:12px;line-height:1.75">
<div><span style="color:var(--cw-term-green);font-weight:600">~/dev $ </span><span style="color:var(--cw-term-fg);font-weight:600">cwcli status my-erp</span></div>
<div><span style="color:var(--cw-term-cyan)">my-erp</span><span style="color:var(--cw-term-dim)">  ·  </span><span style="color:var(--cw-term-magenta)">degraded</span></div>
<div><span style="color:var(--cw-term-green)">web             RUNNING  pid 4711</span></div>
<div><span style="color:var(--cw-term-yellow)">worker_default  BACKOFF  pid —</span></div>
<div><span style="color:var(--cw-term-red)">error: bench 1 answers nothing on 8001</span></div>
<div><span style="color:var(--cw-term-dim)">help: cwcli logs my-erp --bench 1 --process web</span></div>
</div>
</body></html>
