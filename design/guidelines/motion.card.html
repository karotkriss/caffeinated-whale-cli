<!-- @dsCard group="Brand" viewport="700x130" name="Motion" subtitle="Short and flat. The app reports facts arriving from a daemon" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="g" style="grid-template-columns:repeat(4,1fr);gap:10px">
<div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary)">80ms</div><div style="font:var(--type-meta);color:var(--text-muted);margin-top:2px">instant · hover tint</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary)">120ms</div><div style="font:var(--type-meta);color:var(--text-muted);margin-top:2px">fast · control colour</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary)">160ms</div><div style="font:var(--type-meta);color:var(--text-muted);margin-top:2px">base · panel open</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary)">240ms</div><div style="font:var(--type-meta);color:var(--text-muted);margin-top:2px">slow · dialog enter</div></div>
</div>
<p style="margin:12px 0 0;font:var(--type-meta);color:var(--text-muted)">Easing is <code style="font-family:var(--font-mono)">cubic-bezier(.2,.6,.3,1)</code> everywhere. Nothing bounces or springs. The only looping animations are the spinner and the <code style="font-family:var(--font-mono)">unknown</code> pulse.</p>
</body></html>
