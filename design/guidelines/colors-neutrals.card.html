<!-- @dsCard group="Colors" viewport="700x130" name="Cool neutrals" subtitle="A blue-cast ramp — sea, not slate. Surfaces, borders and secondary text" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="g" style="grid-template-columns:repeat(6,1fr)">
<div class="sw" style="background:var(--cw-n-950);color:#b4c3da"><b>950</b><i>var(--cw-n-950)</i></div><div class="sw" style="background:var(--cw-n-900);color:#b4c3da"><b>900</b><i>var(--cw-n-900)</i></div><div class="sw" style="background:var(--cw-n-850);color:#b4c3da"><b>850</b><i>var(--cw-n-850)</i></div><div class="sw" style="background:var(--cw-n-800);color:#b4c3da"><b>800</b><i>var(--cw-n-800)</i></div><div class="sw" style="background:var(--cw-n-700);color:#b4c3da"><b>700</b><i>var(--cw-n-700)</i></div><div class="sw" style="background:var(--cw-n-600);color:#dce6f2"><b>600</b><i>var(--cw-n-600)</i></div>
</div>
<div class="g" style="grid-template-columns:repeat(6,1fr);margin-top:8px">
<div class="sw" style="background:var(--cw-n-500);color:#f2f7fc"><b>500</b><i>var(--cw-n-500)</i></div><div class="sw" style="background:var(--cw-n-400);color:#f2f7fc"><b>400</b><i>var(--cw-n-400)</i></div><div class="sw" style="background:var(--cw-n-300);color:#070b18"><b>300</b><i>var(--cw-n-300)</i></div><div class="sw" style="background:var(--cw-n-200);color:#070b18"><b>200</b><i>var(--cw-n-200)</i></div><div class="sw" style="background:var(--cw-n-100);color:#070b18"><b>100</b><i>var(--cw-n-100)</i></div><div class="sw" style="background:var(--cw-n-50);color:#070b18"><b>50</b><i>var(--cw-n-50)</i></div>
</div>
</body></html>
