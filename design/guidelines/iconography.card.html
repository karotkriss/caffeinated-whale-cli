<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="row" style="gap:16px">
<img src="../assets/icons/play.svg" width="20" height="20" alt="play" title="play" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/square.svg" width="20" height="20" alt="square" title="square" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/rotate-cw.svg" width="20" height="20" alt="rotate-cw" title="rotate-cw" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/refresh-cw.svg" width="20" height="20" alt="refresh-cw" title="refresh-cw" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/terminal.svg" width="20" height="20" alt="terminal" title="terminal" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/box.svg" width="20" height="20" alt="box" title="box" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/layers.svg" width="20" height="20" alt="layers" title="layers" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/package.svg" width="20" height="20" alt="package" title="package" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/scroll-text.svg" width="20" height="20" alt="scroll-text" title="scroll-text" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/globe.svg" width="20" height="20" alt="globe" title="globe" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/triangle-alert.svg" width="20" height="20" alt="triangle-alert" title="triangle-alert" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)"><img src="../assets/icons/trash-2.svg" width="20" height="20" alt="trash-2" title="trash-2" style="filter:invert(84%) sepia(9%) saturate(500%) hue-rotate(180deg)">
</div>
<p style="margin:14px 0 0;font:var(--type-meta);color:var(--text-muted)">48 glyphs are vendored in <code style="font-family:var(--font-mono)">assets/icons/</code> and exposed through the <code style="font-family:var(--font-mono)">Icon</code> component. No emoji in the app UI — the CLI's 💡 tip prefix is the single exception, and it stays in the terminal.</p>
</body></html>
