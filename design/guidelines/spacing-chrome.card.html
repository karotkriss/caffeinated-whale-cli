<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="g" style="grid-template-columns:repeat(4,1fr);gap:10px">
<div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font:var(--type-meta);color:var(--text-muted)">titlebar</div><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary);margin-top:2px">38px</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font:var(--type-meta);color:var(--text-muted)">toolbar / tabs</div><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary);margin-top:2px">44px</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font:var(--type-meta);color:var(--text-muted)">tree width</div><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary);margin-top:2px">264px</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font:var(--type-meta);color:var(--text-muted)">action rail</div><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary);margin-top:2px">216px</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font:var(--type-meta);color:var(--text-muted)">row height</div><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary);margin-top:2px">28px</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font:var(--type-meta);color:var(--text-muted)">control height</div><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary);margin-top:2px">30px</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font:var(--type-meta);color:var(--text-muted)">status bar</div><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary);margin-top:2px">26px</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 10px;background:var(--bg-surface)"><div style="font:var(--type-meta);color:var(--text-muted)">icon rail</div><div style="font-family:var(--font-mono);font-size:var(--text-md);color:var(--text-primary);margin-top:2px">56px</div></div>
</div>
</body></html>
