<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="4px base grid, with 2/6/10 for optical fits against hairlines" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="row" style="align-items:flex-end">
<div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:2px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:4px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:6px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:8px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:10px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">10</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:12px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:16px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:20px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">20</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:24px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:32px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:40px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">40</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:56px;height:34px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:2px"></span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">56</span></div>
</div>
</body></html>
