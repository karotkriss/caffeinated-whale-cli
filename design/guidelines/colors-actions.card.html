<!-- @dsCard group="Colors" viewport="700x130" name="Action colours" subtitle="Accent for the affirmative verb, danger for anything that destroys data" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="row">
<span style="height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--radius-md);background:var(--accent);color:var(--accent-fg);font:var(--type-body-strong)">accent</span>
<span style="height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--radius-md);background:var(--accent-hover);color:var(--accent-fg);font:var(--type-body-strong)">accent-hover</span>
<span style="height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--radius-md);background:var(--accent-soft);color:var(--text-accent);font:var(--type-body-strong)">accent-soft</span>
<span style="height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--radius-md);background:var(--danger);color:var(--danger-fg);font:var(--type-body-strong)">danger</span>
<span style="height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--radius-md);background:var(--danger-soft);color:var(--text-danger);font:var(--type-body-strong)">danger-soft</span>
</div>
<p style="margin:12px 0 0;font:var(--type-meta);color:var(--text-muted)">One accent button per pane. Destructive verbs are never the default focus.</p>
</body></html>
