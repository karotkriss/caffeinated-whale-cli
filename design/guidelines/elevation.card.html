<!-- @dsCard group="Spacing" viewport="700x140" name="Elevation" subtitle="A hairline plus a wide, low-opacity shadow. Nothing glows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}
.g{display:grid;gap:8px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px}
.sw b{font:var(--type-body-strong);font-size:var(--text-sm)}.sw i{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.72;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body>

<div class="row" style="gap:14px">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:120px;height:56px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">sm</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:120px;height:56px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">md</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:120px;height:56px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">lg</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:120px;height:56px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-window)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">window</span></div>
</div>
</body></html>
